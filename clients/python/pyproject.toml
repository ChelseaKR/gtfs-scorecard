# The distributable package. Nothing here is published yet: see
# docs/typed-clients.md for the owner steps (PyPI trusted publisher) that must
# happen first. The code under src/gtfs_scorecard_client/generated/ is written by
# `make clients` from clients/openapi.bundled.json; do not edit it by hand.

[project]
name = "gtfs-scorecard-client"
version = "0.1.0"
description = "Typed Python client for the GTFS Scorecard static read API, generated from its OpenAPI description."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Chelsea Kelly-Reif" }]
keywords = ["gtfs", "transit", "data-quality", "openapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
# Runtime dependencies of the generated code, and only those. The generator is
# not among them: it lives in the dev group below and never ships.
dependencies = [
  "httpx>=0.28,<1",
  "attrs>=25.3",
]

[project.urls]
Homepage = "https://gtfsscorecard.org"
Documentation = "https://github.com/ChelseaKR/gtfs-scorecard/blob/main/docs/typed-clients.md"
Source = "https://github.com/ChelseaKR/gtfs-scorecard/tree/main/clients/python"
Issues = "https://github.com/ChelseaKR/gtfs-scorecard/issues"

[dependency-groups]
# Development tooling only. Every entry is an exact version; uv.lock pins the
# transitive set with hashes and CI runs every command with --locked.
dev = [
  "openapi-python-client==0.29.1",
  "pytest==9.1.1",
  "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_scorecard_client"]

# Applies to the hand-written files only. The generator formats its own output
# with `ruff --isolated`, which ignores this section on purpose.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

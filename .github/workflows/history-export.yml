name: History export

# The history tables (ADR 0063, docs/history-tables.md): once a month, build the
# corpus's check-level and finding-level history as two Parquet tables with the
# data dictionary, provenance, and license, and write the one zip for the month
# to the private artifacts bucket under history/<YYYY-MM>/. A paid checkout for
# the history tables is answered by infra/program-bundle's setup route with a
# 30-day capability link to the newest of these objects; nothing here knows
# about a buyer, and no buyer data is ever an input or an output of this run.
#
# Scheduled on day 4 UTC, after the free dataset release's own window (days 1
# to 3), so the paid monthly build never races the free monthly cut for the
# Daily run's output. Dispatchable by hand for a make-good; a re-run for the
# same month overwrites the same key, which is what a buyer's link points at.
#
# The role is its own (infra/artifacts/github_oidc.tf, history_export): read
# the published artifact tree, write under history/, nothing else. It trusts
# runs on main only, so a dispatch on any other ref fails at the credential
# step rather than writing an object a buyer could be sold.

on:
  schedule:
    - cron: "17 18 4 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "YYYY-MM to write under (default: the current UTC month). Only for a make-good of an earlier month."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: history-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      month: ${{ steps.write.outputs.month }}
    permissions:
      contents: read
      id-token: write # read the artifact tree and write the export through AWS OIDC
    defaults:
      run:
        working-directory: pipeline
    steps:
      # Without a bucket and a role there is nowhere to read from and nowhere
      # to write to, and a green run with no object would read as a month
      # that was built. Refuse instead.
      - name: Refuse to start without the store configuration
        # The job's default working directory is pipeline/, which does not
        # exist before checkout; this step runs first, so it names the
        # workspace itself (the first two runs failed here, 2026-10-06).
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          HISTORY_AWS_ROLE_ARN: ${{ secrets.HISTORY_AWS_ROLE_ARN }}
          MONTH_INPUT: ${{ inputs.month }}
        run: |
          set -euo pipefail
          if [ -z "${ARTIFACTS_BUCKET}" ] || [ -z "${HISTORY_AWS_ROLE_ARN}" ]; then
            echo "::error::ARTIFACTS_BUCKET (repository variable) and HISTORY_AWS_ROLE_ARN (repository secret) must both be set before a history export can run. See docs/history-tables.md."
            exit 1
          fi
          if [ -n "${MONTH_INPUT}" ] && ! [[ "${MONTH_INPUT}" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
            echo "::error::month must be YYYY-MM."
            exit 1
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the locked environment with the query extra
        shell: bash
        run: |
          set -euo pipefail
          # DuckDB writes the Parquet; it is the `query` extra, which the
          # default sync does not install.
          uv sync --locked --extra query

      - name: Authenticate to AWS (history export role)
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.HISTORY_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      # The whole dated history, which is what the tables are made of, plus the
      # index. The checkout's committed snapshot is the fallback for an offline
      # developer and must not be the input here: it runs weeks behind the
      # store. Delete it first so a sync that fails leaves nothing stale to
      # build from, and retry the sync the way pages.yml retries its own.
      #
      # The dated records are ~300,000 objects and ~10 GB (measured
      # 2026-10-22), and each one is immutable once its day has passed. Every
      # run used to download all of them, so each manual re-run of a month cost
      # a full ~10 GB of S3 egress. They now sync into a mirror kept in the
      # Actions cache, with the same `--exact-timestamps --delete` the Intraday
      # refresh and Deploy site mirrors use, so a run transfers only the objects
      # S3 added or changed since the mirror was saved and drops the ones the
      # 400-day lifecycle rule expired. The mirror is a copy of public data and
      # carries nothing private. The index is read separately and in full: it
      # is the pointer, it changes every cycle, and it is stored compressed
      # (scripts/s3-index.sh).
      - name: Restore the dated-artifact mirror
        id: dated-mirror
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dated-artifact-mirror
          key: dated-artifact-mirror-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dated-artifact-mirror-v1-

      - name: Hydrate the dated artifacts from S3
        id: hydrate
        shell: bash
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          rm -rf ../data/artifacts
          mkdir -p ../data/artifacts
          mirror="$RUNNER_TEMP/dated-artifact-mirror"
          log="$RUNNER_TEMP/dated-mirror-sync.log"
          mkdir -p "$mirror"
          : > "$log"
          retry_s3_sync() {
            local label="$1"
            shift
            local attempt
            for attempt in 1 2 3; do
              if "$@" >> "$log"; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "S3 sync failed after ${attempt} attempts: ${label}" >&2
                return 1
              fi
              echo "S3 changed during ${label}; retrying (${attempt}/3)." >&2
              sleep $((attempt * 5))
            done
          }
          retry_s3_sync "dated artifacts" aws s3 sync \
            "s3://${ARTIFACTS_BUCKET}/data/artifacts" "$mirror" \
            --exclude "*" \
            --include "*/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].json" \
            --delete --exact-timestamps --no-progress
          downloads=$(grep -c '^download:' "$log" || true)
          removed=$(grep -c '^delete:' "$log" || true)
          echo "::notice title=dated-artifact mirror::${downloads} objects downloaded, ${removed} removed"
          echo "downloads=${downloads}" >> "$GITHUB_OUTPUT"
          echo "removed=${removed}" >> "$GITHUB_OUTPUT"
          cp -a "$mirror"/. ../data/artifacts/
          ../scripts/s3-index.sh get "${ARTIFACTS_BUCKET}" ../data/artifacts/index.json
          count=$(find ../data/artifacts -name '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].json' | wc -l | tr -d ' ')
          echo "dated artifacts hydrated: ${count}"
          if [ "${count}" -lt 1000 ]; then
            echo "::error::Only ${count} dated artifacts came down from S3; a corpus this small is a failed sync, not a month to sell."
            exit 1
          fi

      # Save only when the mirror moved or there was none to restore. Saving
      # on every run would push a fresh entry of the whole dated history into
      # the repository's 10 GB cache for no change.
      - name: Save the dated-artifact mirror
        if: ${{ steps.hydrate.outputs.downloads != '0' || steps.hydrate.outputs.removed != '0' || steps.dated-mirror.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dated-artifact-mirror
          key: dated-artifact-mirror-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build the history tables
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ../history-out ../history.zip
          uv run scorecard history-export --out ../history-out --zip ../history.zip
          # The five files the contract names, and nothing else, in the zip.
          unzip -Z1 ../history.zip | sort > listed.txt
          printf '%s\n' DATA-DICTIONARY.md LICENSE.md PROVENANCE.json checks.parquet findings.parquet | sort > expected.txt
          if ! diff -u expected.txt listed.txt; then
            echo "::error::The zip does not hold exactly the five files docs/history-tables.md names."
            exit 1
          fi
          {
            echo "## History export"
            echo
            echo "Rows: $(jq -r '.tables.checks.rows' ../history-out/PROVENANCE.json) checks, $(jq -r '.tables.findings.rows' ../history-out/PROVENANCE.json) findings over $(jq -r '.feed_records' ../history-out/PROVENANCE.json) feed records."
            echo "Snapshots: $(jq -r '.snapshot_dates.first' ../history-out/PROVENANCE.json) to $(jq -r '.snapshot_dates.last' ../history-out/PROVENANCE.json)."
            echo "Excluded by request: $(jq -r '.excluded_by_request.feed_records' ../history-out/PROVENANCE.json) feed records."
            echo "Zip: $(stat -c %s ../history.zip) bytes."
          } >> "$GITHUB_STEP_SUMMARY"

      # One key per month, overwritten by a re-run of the same month. The
      # provenance file goes beside it so the owner can read what a month holds
      # without downloading the zip. Encrypted at rest like the stored orders.
      - name: Write the month's export to the private history prefix
        id: write
        shell: bash
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          MONTH_INPUT: ${{ inputs.month }}
        run: |
          set -euo pipefail
          month="${MONTH_INPUT:-$(date -u +%Y-%m)}"
          aws s3 cp ../history.zip "s3://${ARTIFACTS_BUCKET}/history/${month}/history.zip" \
            --content-type application/zip --sse AES256 --only-show-errors
          aws s3 cp ../history-out/PROVENANCE.json "s3://${ARTIFACTS_BUCKET}/history/${month}/PROVENANCE.json" \
            --content-type application/json --sse AES256 --only-show-errors
          echo "wrote history/${month}/history.zip" >> "$GITHUB_STEP_SUMMARY"
          echo "month=${month}" >> "$GITHUB_OUTPUT"

      # The marketplace listing (ADR 0065, docs/data-marketplace.md) delivers
      # the same five files unzipped, so a subscriber can query the Parquet
      # where it lands. Only once the owner has set ADX_DATA_SET_ID; until
      # then this step is skipped and the run is what it was before.
      - name: Write the unzipped tables for the marketplace revision
        if: ${{ vars.ADX_DATA_SET_ID != '' }}
        shell: bash
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          MONTH: ${{ steps.write.outputs.month }}
        run: |
          set -euo pipefail
          month="${MONTH}"
          for name in checks.parquet findings.parquet DATA-DICTIONARY.md PROVENANCE.json LICENSE.md; do
            aws s3 cp "../history-out/${name}" "s3://${ARTIFACTS_BUCKET}/history/${month}/tables/${name}" \
              --sse AES256 --only-show-errors
          done
          echo "wrote history/${month}/tables/ (five files) for the marketplace revision" >> "$GITHUB_STEP_SUMMARY"

      # No upload-artifact step, on purpose: a run artifact of a public
      # repository is published, and this zip is the paid deliverable.
      - name: Say that the month was not built
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "::error::This month's history export did not complete. A buyer who checks out before the next successful run is told no build exists and their checkout is left unused; re-run this workflow on main."

  # One new AWS Data Exchange revision for the month (ADR 0065,
  # docs/data-marketplace.md). Runs only when the owner has created the data
  # set and the product and set ADX_DATA_SET_ID; otherwise the job is skipped
  # and this workflow is exactly the Stripe tier's monthly build. Its own role,
  # separate from the export's: it can add a revision to the one data set and
  # read history/*/tables/*, nothing else. It never creates or changes a
  # product, an offer, or a price; those stay console steps for the owner.
  marketplace:
    needs: export
    if: ${{ vars.ADX_DATA_SET_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # assume the marketplace publishing role through AWS OIDC
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Refuse to start without the publishing role
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          MARKETPLACE_AWS_ROLE_ARN: ${{ secrets.MARKETPLACE_AWS_ROLE_ARN }}
          MONTH: ${{ needs.export.outputs.month }}
        run: |
          set -euo pipefail
          if [ -z "${MARKETPLACE_AWS_ROLE_ARN}" ]; then
            echo "::error::ADX_DATA_SET_ID is set but the MARKETPLACE_AWS_ROLE_ARN secret is not. See docs/data-marketplace.md."
            exit 1
          fi
          if ! [[ "${MONTH}" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
            echo "::error::The export job did not report the month it wrote."
            exit 1
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked

      - name: Authenticate to AWS (marketplace publishing role)
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.MARKETPLACE_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      # Creates the month's revision, imports the five files, checks that the
      # revision holds exactly those five, and finalizes it. A month that is
      # already published is reported and left alone; an unfinalized revision
      # an interrupted run left is deleted and rebuilt.
      - name: Publish the month as a new revision
        shell: bash
        env:
          ADX_DATA_SET_ID: ${{ vars.ADX_DATA_SET_ID }}
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          AWS_REGION_NAME: ${{ vars.AWS_REGION || 'us-west-2' }}
          MONTH: ${{ needs.export.outputs.month }}
        run: |
          set -euo pipefail
          uv run --with boto3 python -m scorecard_pipeline.marketplace_revision \
            --data-set-id "${ADX_DATA_SET_ID}" --bucket "${ARTIFACTS_BUCKET}" \
            --month "${MONTH}" --region "${AWS_REGION_NAME}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Say that the revision was not published
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "::error::This month's AWS Data Exchange revision was not published. Subscribers keep the previous month's build. Re-run this job on main; an unfinalized revision is rebuilt from the start."

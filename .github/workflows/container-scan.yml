name: container-scan

# Container image CVE scan (SECURITY-AND-SUPPLY-CHAIN-STANDARD.md §6.3,
# control SEC-28). Builds each production Dockerfile in this repo
# (infra/compute and infra/instant-score — the two Lambda worker images
# behind the fan-out/instant-score infra, see infra/README.md) and scans
# them with Trivy. A fixable HIGH or CRITICAL OS/library vulnerability fails
# the job; no `|| true`, no continue-on-error. Matches the container-scan.yml
# pattern already used in several sibling projects.
#
# Both images COPY in the MobilityData gtfs-validator CLI jar from
# data/cache/, which is gitignored (not committed — it's a 38MB binary this
# repo fetches on demand). CI fetches the exact pinned release the Dockerfile
# already sha256-verifies and stages it at that path before building, so the
# scanned image matches what a real build produces.

on:
  push:
    branches: [main]
    paths:
      - "infra/compute/Dockerfile"
      - "infra/instant-score/Dockerfile"
      - "pipeline/pyproject.toml"
      - "pipeline/uv.lock"
      - ".dockerignore"
      - ".trivyignore.yaml"
      - "vex.json"
      - ".github/workflows/container-scan.yml"
  pull_request:
    paths:
      - "infra/compute/Dockerfile"
      - "infra/instant-score/Dockerfile"
      - "pipeline/pyproject.toml"
      - "pipeline/uv.lock"
      - ".dockerignore"
      - ".trivyignore.yaml"
      - "vex.json"
      - ".github/workflows/container-scan.yml"
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC — catch new CVEs against a pinned base image

# Least privilege: build + scan only need to read the repo.
permissions:
  contents: read

concurrency:
  group: container-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy image CVE scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compute
            dockerfile: infra/compute/Dockerfile
            tag: gtfs-scorecard-compute:scan
          - name: instant-score
            dockerfile: infra/instant-score/Dockerfile
            tag: gtfs-scorecard-instant-score:scan
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Stage the gtfs-validator CLI jar (version + hash read from the Dockerfile, not duplicated here)
        # data/cache/ is gitignored (see .gitignore); both Dockerfiles COPY
        # this exact file and sha256-verify it in their own RUN step. Parsing
        # the filename/version and the expected hash out of the Dockerfile
        # (rather than hardcoding a second copy in this workflow) means a
        # version bump only has to happen in one place — the Dockerfile — and
        # this job automatically follows it instead of silently staging a
        # stale jar the COPY step can't find.
        run: |
          set -euo pipefail
          dockerfile="${{ matrix.dockerfile }}"
          jar_rel=$(grep -oE 'data/cache/gtfs-validator-[0-9]+\.[0-9]+\.[0-9]+-cli\.jar' "$dockerfile" | head -1)
          jar_sha256=$(grep -oE '^RUN echo "[0-9a-f]{64}' "$dockerfile" | grep -oE '[0-9a-f]{64}' | head -1)
          version=$(echo "$jar_rel" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$jar_rel" ] || [ -z "$jar_sha256" ] || [ -z "$version" ]; then
            echo "::error::could not parse validator jar path/version/hash out of $dockerfile" >&2
            exit 1
          fi
          echo "staging $jar_rel (version $version)"
          mkdir -p data/cache
          curl -fsSL --retry 3 -o "$jar_rel" \
            "https://github.com/MobilityData/gtfs-validator/releases/download/v${version}/gtfs-validator-${version}-cli.jar"
          echo "${jar_sha256}  ${jar_rel}" | sha256sum -c -

      - name: Build production image
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.tag }} .

      - name: Trivy vulnerability scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          scan-type: image
          vuln-type: os,library
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"

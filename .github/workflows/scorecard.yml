name: Daily scorecard

# Fans the daily run out across parallel shards so wall-clock stays flat as the
# registry grows (docs/roadmap.md, Year 1). Each shard scores its own agencies
# and uploads only their artifacts; a single collect job rebuilds the index and
# rollups deterministically, then commits and deploys.

on:
  schedule:
    # 13:23 UTC = early morning Pacific, before agency business hours
    - cron: "23 13 * * *"
  workflow_dispatch:
    inputs:
      shards:
        description: "number of parallel shards"
        default: "32"

# Least privilege by default; the collect and deploy jobs widen it per-job.
permissions:
  contents: read

env:
  # At 2,000+ feed records, 32 shards keeps each score job inside the one-hour
  # AWS OIDC session. Override per-run via workflow_dispatch.
  SHARD_COUNT: ${{ github.event.inputs.shards || '32' }}
  # RELIABILITY (issue #297): a `prlimit --as` ceiling on the validator
  # subprocess, so an overrun fails the allocating syscall and the JVM exits
  # with no report.json (already handled as an ordinary per-agency
  # RuntimeError) instead of the Actions runner itself being killed. Added in
  # #298 as opt-in and never switched on for a scheduled run, which is why the
  # daily has stayed red: the shard validating `ovapi-netherlands` keeps dying
  # with "The runner has received a shutdown signal".
  #
  # 10240 MiB is not a guess. It is the value exercised live against that
  # feed's real current data in run 32508141222, which succeeded at 6,715,340
  # KB peak RSS, matching the unbounded run alongside it. RLIMIT_AS is virtual
  # address space rather than resident set, so this sits well above -Xmx by
  # design; it is a backstop against a genuine runaway, not a tight budget.
  #
  # This does not claim to fix the underlying runner death, whose trigger the
  # incident record says is still unconfirmed, and it no longer claims to
  # change the blast radius either. The 2026-08-28 correction in
  # docs/incidents/2026-08-21-daily-collect-partial-shard-publish.md retracted
  # that: both scheduled runs after the ceiling was switched on died the same
  # way at the same feed, and because the runner itself dies the shard never
  # reaches upload-artifact, so every record it had already scored is
  # discarded with it (order of 65, not one). Kept as a backstop with no
  # observed effect in either direction, not as a remediation.
  SCORECARD_VALIDATOR_MEMORY_MB: "10240"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          python-version: "3.12"
      - id: plan
        working-directory: pipeline
        run: |
          set -euo pipefail
          plan=$(uv run scorecard shards --count "$SHARD_COUNT")
          echo "shards=$plan" >> "$GITHUB_OUTPUT"
          # RELIABILITY (issue #297): the planned shard count is no longer
          # SHARD_COUNT. `scorecard shards` gives every `large_feed` a shard of
          # its own, so the plan is SHARD_COUNT round-robin shards plus one per
          # large feed, and collect counts uploaded bundles against this
          # number. Reading SHARD_COUNT down there would compare 42 bundles
          # present against 32 expected, leave every shortfall comparison
          # false, and put the silent shard-loss defect back the same day #322
          # removed it.
          count=$(printf '%s' "$plan" | jq 'length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "planned shards: $count (SHARD_COUNT=$SHARD_COUNT plus one per large feed)"

  score:
    needs: plan
    runs-on: ubuntu-latest
    # RELIABILITY (issue #297): a shard whose runner is killed mid-validation
    # (observed: ovapi-netherlands, "received a shutdown signal") previously had
    # no bound short of the platform's 360-minute default, so a hang was
    # indistinguishable from a slow shard for six hours. Sized above the
    # slowest recent successful shard (~32 min) with headroom for registry
    # growth; a shard that blows through this is a hang worth surfacing, not
    # ordinary variance.
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write # OIDC for the optional S3 validator cache
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          python-version: "3.12"
      # Read/write the S3 validator-result cache so unchanged feeds skip the Java
      # validator across runners and days. Gated on ARTIFACTS_BUCKET, so forks and
      # the pilot (no variable) skip it and the cache stays file-only.
      - name: Authenticate to AWS
        if: ${{ vars.ARTIFACTS_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
      - name: Score this shard's agencies
        working-directory: pipeline
        env:
          # Empty when ARTIFACTS_BUCKET is unset, which the cache treats as off.
          VALIDATOR_CACHE_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
          # zizmor(template-injection): pass through an env var rather than
          # interpolating directly into the script below. matrix.shard is
          # produced by `scorecard shards` (plan job, this repo's own code,
          # not attacker-influenceable), but the env-var indirection closes
          # the class of finding regardless of content.
          MATRIX_SHARD: ${{ toJSON(matrix.shard) }}
        run: |
          # `bash -e {0}` is the Actions default: -e without -o pipefail. The
          # work of this step happens inside `... | jq -r '.[]' | while read`,
          # where jq is not the last element, so its exit status was discarded.
          # A malformed matrix slice or a `scorecard shards` output change made
          # the loop read nothing, iterate zero times, and exit 0: a shard that
          # scored no agency at all reported as a clean shard, and
          # `if-no-files-found: ignore` on the upload below meant nothing
          # downstream noticed either.
          set -euo pipefail
          # One agency's feed being unreachable (a 403, a vendor outage) must not
          # abort the shard and skip the whole daily refresh. Score each agency
          # independently; a failure is a warning, and the agencies that did score
          # are still published.
          #
          # Stage only the agencies this shard actually scores into a clean dir.
          # checkout populates data/artifacts with every agency's committed copy,
          # so uploading the whole tree let a later shard's stale copy overwrite
          # this shard's fresh score when collect merged them (merge-multiple is
          # last-writer-wins), silently reverting ~11/12 of agencies each run.
          # Uploading per-scored-agency makes that merge a clean union.
          stage="$GITHUB_WORKSPACE/shard-artifacts"
          outcomes="$GITHUB_WORKSPACE/shard-outcomes.ndjson"
          rm -rf "$stage" "$outcomes"
          mkdir -p "$stage"
          echo "shard_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "$MATRIX_SHARD" | jq -r '.[]' | while read -r id; do
            echo "::group::$id"
            if [ -n "$ARTIFACTS_BUCKET" ]; then
              today=$(date -u +%Y-%m-%d)
              yesterday=$(date -u -d yesterday +%Y-%m-%d)
              aws s3 sync "s3://${ARTIFACTS_BUCKET}/data/artifacts/${id}" \
                "$GITHUB_WORKSPACE/data/artifacts/${id}" \
                --exclude "*" --include "latest.json" \
                --include "${today}.json" --include "${yesterday}.json" \
                --only-show-errors
              aws s3 cp "s3://${ARTIFACTS_BUCKET}/cache/fixlog/${id}/fixlog.json" \
                "$GITHUB_WORKSPACE/data/artifacts/${id}/fixlog.json" \
                --only-show-errors || true
              mkdir -p "$GITHUB_WORKSPACE/data/cache/structure"
              aws s3 cp "s3://${ARTIFACTS_BUCKET}/cache/structure/${id}.json" \
                "$GITHUB_WORKSPACE/data/cache/structure/${id}.json" \
                --only-show-errors || true
            fi
            uv run --with boto3 python -m scorecard_pipeline.cli run \
              --agency "$id" --skip-unchanged --outcome-out "$outcomes" && EXIT=0 || EXIT=$?
            if [ "$EXIT" -eq 0 ]; then
              # Structure fingerprints contain derived stop coordinates. Move
              # them through a run-scoped private S3 prefix instead of a
              # downloadable Actions artifact; collect promotes them while it
              # holds the serialized publish lock.
              if [ -n "$ARTIFACTS_BUCKET" ] && \
                 [ -f "$GITHUB_WORKSPACE/data/cache/structure/${id}.json" ]; then
                aws s3 cp "$GITHUB_WORKSPACE/data/cache/structure/${id}.json" \
                  "s3://${ARTIFACTS_BUCKET}/cache/structure-staging/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${id}.json" \
                  --only-show-errors
              fi
              mkdir -p "$stage/$id"
              cp -a "$GITHUB_WORKSPACE/data/artifacts/$id/." "$stage/$id/"
              # Raw fix state is reconciled again in collect from the private
              # durable copy. Never expose it through a workflow artifact.
              rm -f "$stage/$id/validator-cache.json" \
                "$stage/$id/structure.json" "$stage/$id/fixlog.json" \
                "$stage/$id/corrected.zip"
            elif [ "$EXIT" -eq 2 ]; then
              echo "feed unchanged, keeping last artifact"
            else
              echo "::warning title=scoring failed::$id did not score this run (kept its last good artifact)"
            fi
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifacts-${{ strategy.job-index }}
          path: shard-artifacts
          retention-days: 1
          if-no-files-found: ignore
      # FIX-11 (docs/ideation/02-large-scale-fixes.md): each agency above ran as
      # its own `scorecard run` process (so one agency failing can't abort the
      # shard), so their outcomes accumulate in one ndjson log via
      # --outcome-out. Turn that log into this shard's run-summary.json now,
      # while the shard's own start/end time is still at hand; collect merges
      # every shard's copy into the public /status/ page.
      - name: Build this shard's run-health summary
        working-directory: pipeline
        run: |
          uv run scorecard run-summary build \
            --shard "${{ strategy.job-index }}" \
            --outcomes "$GITHUB_WORKSPACE/shard-outcomes.ndjson" \
            --started "$shard_started_at" \
            --out "$GITHUB_WORKSPACE/run-summary.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: run-summary-${{ strategy.job-index }}
          path: run-summary.json
          retention-days: 1
          if-no-files-found: warn

  collect:
    # `plan` is here for its shard_count output, the denominator the shortfall
    # check and the run-health merge both measure against (issue #297).
    needs: [plan, score]
    # RELIABILITY (issue #297): `needs: score` alone defaults to `if: success()`,
    # so one dead shard (e.g. a runner killed validating a large feed) skipped
    # collect and deploy entirely and dropped the whole day's publish, even
    # though the other 31 shards scored cleanly. `!cancelled()` runs collect
    # whenever the workflow wasn't cancelled outright, regardless of individual
    # shard outcomes; the artifact-count floor below refuses to publish only
    # when that leniency would otherwise ship an empty corpus.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: artifacts-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC for the optional CDN mirror
      actions: read # count shard artifact bundles before trusting a publish
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          python-version: "3.12"
      - name: Authenticate to AWS
        if: ${{ vars.ARTIFACTS_BUCKET != '' || vars.SES_FROM != '' }}
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
      - name: Hydrate the authoritative current corpus and compact history
        if: ${{ vars.ARTIFACTS_BUCKET != '' }}
        run: |
          set -euo pipefail
          # Hydrate before overlaying this run's shard outputs. latest.json is
          # the durable current artifact for a skipped feed; index.json proves
          # which snapshot it must represent. Reindex uses that verified pair
          # even when lifecycle retention removed its dated object, so it cannot
          # roll current back to the older cutover files in the checkout.
          aws s3 cp "s3://${{ vars.ARTIFACTS_BUCKET }}/data/artifacts/index.json" \
            data/artifacts/index.json --only-show-errors
          aws s3 cp "s3://${{ vars.ARTIFACTS_BUCKET }}/data/artifacts" data/artifacts \
            --recursive --exclude "*" --include "*/latest.json" --only-show-errors
          # index.json is the public commit pointer. A failed intraday run can
          # upload a newer latest.json before it reaches the final index write,
          # so hydrate the dated snapshots the index actually names as well.
          # Reindex can then ignore any ahead-of-index latest safely and retain
          # the last committed artifact instead of falling back to checkout.
          jq -r '.agencies[].history[-1].date // empty' data/artifacts/index.json \
            | sort -u | while IFS= read -r authoritative_date; do
              if ! [[ "$authoritative_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                echo "::error::Invalid authoritative artifact date: $authoritative_date"
                exit 1
              fi
              aws s3 cp "s3://${{ vars.ARTIFACTS_BUCKET }}/data/artifacts" data/artifacts \
                --recursive --exclude "*" \
                --include "*/${authoritative_date}.json" --only-show-errors
            done
          aws s3 sync "s3://${{ vars.ARTIFACTS_BUCKET }}/data/artifacts" data/artifacts \
            --exclude "*" --include "rollups/*.state.json" \
            --include "coverage-baseline.json" --only-show-errors
          aws s3 sync "s3://${{ vars.ARTIFACTS_BUCKET }}/cache/fixlog" data/artifacts \
            --only-show-errors
      - name: Gather shard artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: data/artifacts
      # RELIABILITY (issue #297): download-artifact silently tolerates a
      # missing shard bundle (a shard whose runner died before upload has
      # nothing to fetch), so a run where every shard failed would otherwise
      # merge zero files into data/artifacts and reindex/publish an empty
      # corpus with no error. Count the shard bundles this run actually
      # produced against how many `plan` scheduled, before spending any more
      # of this job on them.
      - name: Verify shard artifacts before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as env rather than interpolated into the script body, the
          # same way the score job handles matrix.shard.
          PLANNED_SHARDS: ${{ needs.plan.outputs.shard_count }}
        run: |
          set -euo pipefail
          expected="${PLANNED_SHARDS:-}"
          # Fail closed: without a denominator every comparison below is
          # meaningless, and a meaningless shortfall check reads exactly like a
          # passing one.
          if ! [ "${expected:-0}" -gt 0 ] 2>/dev/null; then
            echo "::error::plan reported no shard count (got '${expected}'); refusing to publish without a denominator for the shortfall check."
            exit 1
          fi
          got=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --paginate --jq '.artifacts[].name' | grep -c '^artifacts-' || true)
          echo "shard artifact bundles present: $got / $expected"
          if [ "$got" -eq 0 ]; then
            echo "::error::No shard uploaded any artifacts this run (0/$expected). Every score shard failed or its runner died before upload; refusing to publish an empty corpus. See the score jobs above for the cause."
            exit 1
          fi
          half=$(( expected / 2 ))
          if [ "$got" -lt "$half" ]; then
            echo "::warning title=Most shards missing::Only $got of $expected shards uploaded artifacts this run. Publishing anyway with the shards that did score; investigate the missing ones."
          elif [ "$got" -lt "$expected" ]; then
            # A single dead shard used to pass this step in silence: 31 of 32 is
            # neither zero nor below half, so nothing was printed at all, and
            # roughly one thirty-second of the corpus quietly kept yesterday's
            # scorecard. Any shortfall is now named here, and the merged
            # run-health summary marks the run degraded on /status/.
            echo "::warning title=Shard missing::Only $got of $expected shards uploaded artifacts this run. Publishing with the shards that did score; the feed records owned by the missing $(( expected - got )) keep their previous scorecard."
          fi
      - name: Gather shard run-health summaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: run-summary-*
          path: run-summaries
        # A shard whose runner crashed before uploading (rather than an
        # individual agency failing) simply has no run-summary-N artifact;
        # merge below tolerates that and undercounts rather than failing.
        continue-on-error: true
      - name: Fetch NTD annual ridership (rider-trips weighting, ADR 0021)
        working-directory: pipeline
        run: |
          uv run scorecard ntd-ridership --fetch \
            || echo "::warning title=ridership fetch failed::rider-trips weighting will use the last snapshot (or be omitted) this run"
      # FIX-11: merge every shard's run-summary.json into the one artifact
      # /status/ reads, before render-site (which embeds it in the page and
      # in api/v1/run-status.json).
      - name: Merge run-health summaries
        working-directory: pipeline
        env:
          # Same denominator the shortfall check above measures against: the
          # count `plan` actually produced, not the requested SHARD_COUNT.
          PLANNED_SHARDS: ${{ needs.plan.outputs.shard_count }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          summaries=(../run-summaries/run-summary-*/run-summary.json)
          if [ ${#summaries[@]} -eq 0 ]; then
            echo "::warning title=no run-health summaries::no shard uploaded a run-summary.json; /status/ will keep showing the previous run"
          else
            # --expected-shards is the denominator the merge cannot infer for
            # itself. A shard whose runner is killed (observed daily on the
            # ovapi-netherlands shard) uploads no run-summary.json, so it is
            # absent from the glob rather than present and empty, and every
            # total below is summed over the survivors. Without the planned
            # count, losing a whole shard's feed records left `degraded` false
            # and /status/ said "Run completed".
            uv run scorecard run-summary merge \
              --expected-shards "$PLANNED_SHARDS" \
              --out ../data/artifacts/run/latest.json "${summaries[@]}"
            jq -r '.degraded_reasons[]? | "::warning title=pipeline run degraded::" + .' \
              ../data/artifacts/run/latest.json
          fi
      - name: Rebuild index and rollups
        working-directory: pipeline
        run: |
          uv run scorecard reindex
          uv run scorecard rollups
          # Regenerate the guarded named-change payload before S3 publish. The
          # renderer also prunes legacy change snapshots whose comparison
          # contract cannot be audited.
          uv run scorecard render-site
      - name: Vendor support report
        working-directory: pipeline
        run: |
          {
            echo "## Vendor support snapshot"
            echo ""
            echo "_Internal tool — shows which feed hosts have the most expiry problems. Not public._"
            echo ""
            uv run scorecard vendor-report --format markdown || true
          } >> "$GITHUB_STEP_SUMMARY"
      # EXP-12: the week-over-week cohort digest for liaisons, on the Monday
      # run only. --save advances each rollup's baseline snapshot (persisted
      # via the S3 sync below and re-hydrated above), so running it daily
      # would shrink every "week" to a day. Delivery is the private run
      # summary; email stays behind its consent gate.
      - name: Weekly portfolio digest
        working-directory: pipeline
        run: |
          if [ "$(date -u +%u)" != "1" ]; then
            echo "Not Monday (UTC); the weekly portfolio digest advances on Mondays."
            exit 0
          fi
          uv run scorecard portfolio-digest --save \
            --out ../data/artifacts/rollups/digest.md || true
          {
            echo "## Weekly portfolio digest"
            echo ""
            cat ../data/artifacts/rollups/digest.md 2>/dev/null || echo "_Digest build failed this run; see the step log._"
          } >> "$GITHUB_STEP_SUMMARY"
      # FIX-08's weekly advisory: coverage normally only rises as curation
      # adds entries, so a drop means new high-volume codes are reaching
      # readers with generic fallback text. Advisory by design — it warns,
      # it never blocks the run.
      - name: Weekly plain-language coverage check
        working-directory: pipeline
        run: |
          if [ "$(date -u +%u)" != "1" ]; then
            echo "Not Monday (UTC); the coverage baseline advances on Mondays."
            exit 0
          fi
          uv run scorecard coverage-check --save | tee coverage-check.log || true
          if grep -q '^COVERAGE DROP' coverage-check.log; then
            echo "::warning title=Plain-language coverage dropped::$(cat coverage-check.log)"
          fi
      # Mirror to the CloudFront-backed bucket once infra/artifacts is applied.
      # Gated on the ARTIFACTS_BUCKET repo variable, so the pilot and forks
      # (which set no variable) skip it entirely and keep serving from Pages.
      - name: Publish artifacts to S3
        if: ${{ vars.ARTIFACTS_BUCKET != '' }}
        run: |
          # Dated history is additive: S3 is the durable record of artifacts a
          # fresh collect checkout does not carry. The retirement manifest is
          # the bounded exception; it deletes only fixed mutable filenames for
          # registry-retired ids and cannot name date-shaped evidence.
          # Persist only reconciled, registry-bounded fix logs in the private
          # prefix. --delete retires stale state that reindex removed locally.
          fixlog_stage="$RUNNER_TEMP/private-fixlogs"
          rm -rf "$fixlog_stage"
          mkdir -p "$fixlog_stage"
          jq -r '.agencies | keys[]' data/artifacts/index.json | while IFS= read -r id; do
            if [ -f "data/artifacts/${id}/fixlog.json" ]; then
              mkdir -p "$fixlog_stage/$id"
              cp "data/artifacts/${id}/fixlog.json" "$fixlog_stage/$id/fixlog.json"
            fi
          done
          mkdir -p data/cache/structure
          aws s3 sync \
            "s3://${{ vars.ARTIFACTS_BUCKET }}/cache/structure-staging/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" \
            data/cache/structure --only-show-errors
          # Not `aws s3 sync`: it transfers when the local mtime is newer than
          # the object, and a fresh checkout makes every one of the ~28,700
          # local files newer on every run, so the whole tree was re-PUT daily
          # to change about 3,100 objects. `publish-artifacts` compares the
          # local MD5 against each object's ETag (single-part, SSE-S3, so the
          # ETag is the content MD5) and uploads on any doubt: missing object,
          # different size, non-MD5 ETag, or hash mismatch. `--size-only` would
          # also have cut the PUTs, but it would silently stop publishing a
          # re-score that kept the same byte length. Dated evidence stays
          # additive; only the exact mutable keys in the retirement manifest
          # are deleted. The root index is the aggregate discovery pointer, so
          # it is excluded here and uploaded only after all public writes and
          # deletes. Direct mutable latest.json consumers are not atomic with
          # this sequence; the deployed Pages manifest is the bound snapshot.
          artifact_uri="s3://${{ vars.ARTIFACTS_BUCKET }}/data/artifacts"
          uv run --project pipeline --with boto3 scorecard publish-artifacts \
            --root data/artifacts \
            --bucket "${{ vars.ARTIFACTS_BUCKET }}" --prefix data/artifacts \
            --retirement-manifest data/artifacts/.retired-current-artifacts.json \
            --exclude "index.json" \
            --exclude "*/validator-cache.json" --exclude "*/structure.json" \
            --exclude "*/fixlog.json" --exclude "*/corrected.zip" \
            --cache-control "max-age=300"
          # Remove legacy public-path pipeline state after every upload.
          aws s3 rm "s3://${{ vars.ARTIFACTS_BUCKET }}/data/artifacts" --recursive \
            --exclude "*" --include "*/validator-cache.json" \
            --include "*/structure.json" --include "*/fixlog.json" \
            --include "*/corrected.zip" --only-show-errors
          # Named-change history is a bounded public claim surface, not the
          # long-lived per-feed archive. Remove legacy objects that the current
          # comparison-contract cleanup rejected locally.
          aws s3 sync data/artifacts/changes \
            "s3://${{ vars.ARTIFACTS_BUCKET }}/data/artifacts/changes" \
            --delete --cache-control "max-age=300" --only-show-errors
          # Advance the aggregate index only after every public artifact write
          # and bounded deletion above has completed successfully.
          aws s3 cp data/artifacts/index.json "${artifact_uri}/index.json" \
            --cache-control "max-age=300" --only-show-errors
          # Advance private comparison memory only after the public publication
          # it describes succeeded.
          aws s3 sync "$fixlog_stage" \
            "s3://${{ vars.ARTIFACTS_BUCKET }}/cache/fixlog" --delete --only-show-errors
          aws s3 sync data/cache/structure \
            "s3://${{ vars.ARTIFACTS_BUCKET }}/cache/structure" --only-show-errors
          aws s3 rm \
            "s3://${{ vars.ARTIFACTS_BUCKET }}/cache/structure-staging/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" \
            --recursive --only-show-errors
      - name: Verify the CDN privacy boundary
        if: ${{ vars.ARTIFACTS_BUCKET != '' }}
        env:
          ARTIFACTS_CDN: ${{ vars.ARTIFACTS_CDN || 'd14aimrgrbaz2a.cloudfront.net' }}
        run: |
          set -euo pipefail
          artifact="$(find data/artifacts -mindepth 2 -maxdepth 2 -type f \
            -name latest.json -print -quit)"
          if [ -z "$artifact" ]; then
            echo "No current artifact was available for the CDN privacy canary." >&2
            exit 1
          fi
          sha="$(jq -r '.feed.sha256 // empty' "$artifact")"
          if [ -z "$sha" ]; then
            echo "No feed hash was available for the CDN privacy canary." >&2
            exit 1
          fi
          agency="$(basename "$(dirname "$artifact")")"
          public_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --head --max-time 30 "https://${ARTIFACTS_CDN}/${artifact}")"
          if [ "$public_status" != "200" ]; then
            echo "Public latest artifact was not reachable through the CDN (HTTP ${public_status})." >&2
            exit 1
          fi
          for private_path in "feeds/${sha}.zip" \
            "data/artifacts/${agency}/validator-cache.json" \
            "data/artifacts/${agency}/structure.json" \
            "data/artifacts/${agency}/fixlog.json" \
            "data/artifacts/${agency}/corrected.zip"; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --head --max-time 30 "https://${ARTIFACTS_CDN}/${private_path}")"
            if [ "$status" != "403" ] && [ "$status" != "404" ]; then
              echo "Private object ${private_path} was reachable through the CDN (HTTP ${status})." >&2
              exit 1
            fi
            echo "Private object ${private_path} stayed private (HTTP ${status})."
          done
      # Lifecycle tagging is intentionally sequential and currently takes
      # roughly half an hour. Refresh the one-hour OIDC session here so corpus
      # growth cannot expire the collect job's original credentials mid-step.
      - name: Refresh AWS credentials before lifecycle tagging
        if: ${{ vars.ARTIFACTS_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
      - name: Tag today's dated artifacts for lifecycle expiration
        if: ${{ vars.ARTIFACTS_BUCKET != '' }}
        run: |
          set -euo pipefail
          # The bucket's expire-dated-artifacts lifecycle rule (infra/artifacts)
          # only matches objects tagged artifact-class=dated, so tag today's
          # newly-synced <agency>/<date>.json files here. latest.json,
          # badge.json and directory.json never match this filename pattern, so
          # they never get this tag and never expire. Validator caches live
          # outside the published artifact tree. History synced before this
          # step existed stays untagged
          # (fails open: it never expires rather than expiring by surprise)
          # until a future run happens to touch it again.
          tag_dated_artifact() {
            local key="$1"
            local attempt
            for attempt in 1 2 3 4; do
              if aws s3api put-object-tagging \
                --bucket "${{ vars.ARTIFACTS_BUCKET }}" \
                --key "$key" \
                --tagging 'TagSet=[{Key=artifact-class,Value=dated}]' \
                --output text >/dev/null; then
                return 0
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "::error title=lifecycle tagging failed::Could not tag ${key} after ${attempt} attempts"
                return 1
              fi
              sleep $((attempt * 2))
            done
          }
          today=$(date -u +%Y-%m-%d)
          find data/artifacts -mindepth 2 -maxdepth 2 -type f -name "${today}.json" | while read -r f; do
            key="${f#./}"
            tag_dated_artifact "$key"
          done

      # Send opt-in feed-health emails to confirmed subscribers in the DynamoDB
      # store. Gated on SES_FROM, so it is off until an operator verifies an SES
      # sender and sets SES_FROM. boto3 is pulled in per-run. ALERTS_API_BASE puts
      # a working unsubscribe link in each email.
      - name: Send feed-health digest
        if: ${{ vars.SES_FROM != '' }}
        working-directory: pipeline
        env:
          SUBSCRIPTIONS_TABLE: gtfs-scorecard-subscriptions
          ALERTS_API_BASE: https://5oemr66b9a.execute-api.us-west-2.amazonaws.com
        run: uv run --with boto3 python -m scorecard_pipeline.cli notify --send --from "${{ vars.SES_FROM }}"

      # The digest silently never sending is worse than it loudly not sending:
      # if the variable is unset, say so in the run summary every day so an
      # operator who expected email notices the gap the first day, not weeks in.
      - name: Note when the digest is off
        if: ${{ vars.SES_FROM == '' }}
        run: |
          echo "::warning title=feed-health digest is off::SES_FROM is unset, so no expiry emails were sent this run. Set the SES_FROM Actions variable (docs/deploy.md §2) to turn sending on."

  # Pushes made with GITHUB_TOKEN do not trigger the push-driven pages
  # workflow, so deploy explicitly after the refresh.
  deploy:
    needs: collect
    # RELIABILITY (issue #297, finishing the remediation): `collect` gained
    # `if: !cancelled()` so a dead shard could not skip the publish, but
    # `deploy` kept the implicit `if: success()`, which GitHub evaluates over
    # the whole job ancestry rather than over `needs:` alone. So a failed
    # `score` shard went on skipping `deploy` even when `collect` succeeded,
    # which is the second half of what the incident's own root cause described
    # ("skipping collect (and, transitively, deploy)"). Observed on runs
    # 32975621570, 32854480196 and 32642725318: `collect: success`,
    # `deploy: skipped`. Gate on `collect`'s own result instead, so this job
    # tracks the thing it actually depends on.
    if: ${{ !cancelled() && needs.collect.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      # Data refresh: performance budgets warn instead of blocking, so a
      # Lighthouse variance cannot stale the pages (FIX-14). Accessibility
      # still blocks.
      perf_gate: advisory
    secrets:
      PAGES_AWS_ROLE_ARN: ${{ secrets.PAGES_AWS_ROLE_ARN }}

name: Program report bundle

# The program tier's fulfilment step (docs/program-plan.md, ADR 0049): render
# one program's branded board reports for a cohort of agencies, zip them with
# a manifest, put the archive behind a 30-day capability link, and email the
# link. GitHub Actions is the on-demand compute, the same way onboard.yml
# scores a feed on request, so the tier needs no always-on server.
#
# Dispatched by infra/program-bundle (the post-checkout setup Lambda, and the
# weekly refresh Lambda for subscriptions). It can also be dispatched by hand
# for a test-mode run or a make-good. Payment is settled before dispatch; this
# workflow never talks to Stripe.
#
# Every input is untrusted. Inputs reach the pipeline through environment
# variables and a JSON file written by Python, never interpolated into a
# shell command, and the pipeline's parse_request validates all of them
# (id pattern, cohort cap, accent, email, logo shape) before anything is
# fetched or rendered.
#
# Delivery degrades honestly. Without an artifacts bucket, the committed
# snapshot is used. Without the program-bundle API (BUNDLE_API_BASE) the
# archive is kept as a run artifact and no email is sent, because an email
# with a link that will not work is worse than no email.

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "32 lowercase hex characters; the download capability"
        required: true
        type: string
      program_name:
        description: "Goes on every report cover (120 characters max)"
        required: true
        type: string
      accent:
        description: "#rrggbb accent for the cover band and rules"
        required: false
        default: ""
        type: string
      logo:
        description: "https URL or SVG/PNG/JPEG data: URI, optional"
        required: false
        default: ""
        type: string
      agency_ids:
        description: "Comma-separated scorecard ids, up to 100"
        required: true
        type: string
      deliver_to:
        description: "Email address the download link goes to"
        required: true
        type: string
      cadence:
        description: "one_time or monthly (changes the email's wording only)"
        required: false
        default: "one_time"
        type: choice
        options: [one_time, monthly]
      dispatch_key:
        description: "sha256(bundle_id) truncated; groups this bundle's runs without naming it"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# `bundle_id` is the download capability (see infra/program-bundle/setup_handler.py:
# "the capability in the email is the credential"), and this repository is public.
# It must not appear in any string GitHub may render on a run page. That rules it
# out here and in the artifact name below, and a concurrency expression cannot
# hash anything, so the dispatcher supplies `dispatch_key` -- sha256 of the bundle
# id, truncated -- instead.
#
# Grouping still has to be per bundle rather than global. A single group would
# make two buyers' builds queue, and GitHub keeps only ONE pending run per group:
# a third arrival evicts the queued one, which here is a paid order dropped in
# silence. Scoped to one bundle, that eviction can only ever drop a duplicate run
# of the same build.
#
# The `|| github.run_id` fallback is for a hand dispatch, and for the window
# between this workflow reaching main and the Lambda being redeployed to send the
# key. It degrades to "no grouping", never to "one shared group": no grouping
# risks two identical runs writing one S3 key, which is harmless, while a shared
# group risks losing an order.
concurrency:
  group: report-bundle-${{ inputs.dispatch_key || github.run_id }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # read/write the artifacts bucket through AWS OIDC
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked

      - name: Write and validate the request
        env:
          IN_BUNDLE_ID: ${{ inputs.bundle_id }}
          IN_PROGRAM_NAME: ${{ inputs.program_name }}
          IN_ACCENT: ${{ inputs.accent }}
          IN_LOGO: ${{ inputs.logo }}
          IN_AGENCY_IDS: ${{ inputs.agency_ids }}
          IN_DELIVER_TO: ${{ inputs.deliver_to }}
          IN_CADENCE: ${{ inputs.cadence }}
        run: |
          uv run python - <<'PY'
          import json, os
          keys = ("bundle_id", "program_name", "accent", "logo", "agency_ids", "deliver_to", "cadence")
          request = {k: os.environ.get(f"IN_{k.upper()}", "") for k in keys}
          with open("request.json", "w") as fh:
              json.dump(request, fh)
          PY
          uv run scorecard bundle --request request.json --plan plan.json
          {
            echo "## Program report bundle"
            echo
            echo "Fetching $(jq '.current | length' plan.json) current agencies;"
            echo "$(jq '.refused | length' plan.json) ids refused before the build (see manifest)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate to AWS
        if: ${{ vars.ARTIFACTS_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      # Only what the report reads: the index (history) and each requested
      # agency's current artifact. Not the whole corpus; a bundle is a hundred
      # files at most, and the daily run's full sync would take minutes.
      #
      # The checkout already carries a committed snapshot of data/artifacts,
      # which is the fallback when no bucket is configured. It must not be the
      # fallback when a bucket IS configured: that snapshot is re-materialised
      # by hand and runs weeks behind, so a `cp` that failed for one agency
      # would leave a stale grade in place and the report would print it as
      # today's, dressed in a fresh history from the index that was fetched
      # successfully. Delete each requested agency's copy first, so a failed
      # fetch becomes an id the manifest names rather than a wrong number
      # nobody can see is wrong.
      #
      # And retry, the way pages.yml retries its own sync. The free site gets
      # three attempts at the same objects; a paid bundle was getting one, so
      # a blip that costs the site nothing cost a buyer an agency. A 404 is
      # not a blip -- that agency has no published artifact -- so it is taken
      # at its word and not retried.
      - name: Hydrate the requested artifacts from S3
        if: ${{ vars.ARTIFACTS_BUCKET != '' }}
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp "s3://${ARTIFACTS_BUCKET}/data/artifacts/index.json" ../data/artifacts/index.json --only-show-errors
          fetch_latest() {
            local id="$1" attempt err
            for attempt in 1 2 3; do
              if err=$(aws s3 cp \
                  "s3://${ARTIFACTS_BUCKET}/data/artifacts/${id}/latest.json" \
                  "../data/artifacts/${id}/latest.json" --only-show-errors 2>&1); then
                return 0
              fi
              case "$err" in
                *"(404)"*|*"Not Found"*|*"does not exist"*)
                  echo "no published artifact in S3 for ${id}" >&2
                  return 1
                  ;;
              esac
              if [ "$attempt" -eq 3 ]; then
                echo "S3 read failed three times for ${id}: ${err}" >&2
                return 1
              fi
              echo "S3 read failed for ${id}; retrying (${attempt}/3)." >&2
              sleep $((attempt * 5))
            done
          }
          : > unhydrated.txt
          jq -r '.current[]' plan.json | while read -r id; do
            mkdir -p "../data/artifacts/${id}"
            rm -f "../data/artifacts/${id}/latest.json"
            if ! fetch_latest "$id"; then
              printf '%s\n' "$id" >> unhydrated.txt
            fi
          done
          if [ -s unhydrated.txt ]; then
            {
              echo
              echo "**Not hydrated from S3** (no current artifact was fetched; each is named in"
              echo "the manifest as not published):"
              sed 's/^/  - /' unhydrated.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Render the bundle
        run: uv run scorecard bundle --request request.json --out bundle.zip --manifest manifest.json

      - name: Upload the archive behind its capability key
        if: ${{ vars.ARTIFACTS_BUCKET != '' }}
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          # program-bundles/ is outside the CloudFront allow-list and expires
          # after 30 days (infra/artifacts lifecycle). The only way to it is
          # the download route in infra/program-bundle, which presigns per click.
          aws s3 cp bundle.zip "s3://${ARTIFACTS_BUCKET}/program-bundles/${BUNDLE_ID}/bundle.zip" \
            --content-type application/zip --only-show-errors

      - name: Email the download link
        if: ${{ vars.ARTIFACTS_BUCKET != '' && vars.BUNDLE_API_BASE != '' && vars.SES_FROM != '' }}
        env:
          BUNDLE_API_BASE: ${{ vars.BUNDLE_API_BASE }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          SES_FROM: ${{ vars.SES_FROM }}
        run: |
          set -euo pipefail
          expires="$(date -u -d '+30 days' +%Y-%m-%d)"
          uv run --with boto3 python -m scorecard_pipeline.cli bundle-email \
            --request request.json --manifest manifest.json \
            --download-url "${BUNDLE_API_BASE%/}/download/${BUNDLE_ID}" \
            --expires-on "$expires" --out email.txt --send --from "$SES_FROM"

      - name: Say when delivery is off
        if: ${{ vars.ARTIFACTS_BUCKET == '' || vars.BUNDLE_API_BASE == '' || vars.SES_FROM == '' }}
        run: |
          {
            echo
            echo "**No email was sent.** ARTIFACTS_BUCKET, BUNDLE_API_BASE, and SES_FROM must all be"
            echo "set for delivery; the archive is attached to this run instead (30-day retention)."
          } >> "$GITHUB_STEP_SUMMARY"

      # The artifact name is public. Measured 2026-09-12 against the two runs
      # that existed: an unauthenticated GET of
      # /repos/ChelseaKR/gtfs-scorecard/actions/runs/<id>/artifacts returned
      # `program-bundle-<the 32-hex bundle id>`, the same string renders on the
      # run page, and GET <api>/download/<that id> answered 302 to a presigned
      # S3 URL while a never-issued id answered 404. The name was a working
      # download credential for anyone reading the Actions tab.
      # A run of this workflow is a paid order, and until this step existed
      # nothing in the repository noticed when one died. The buyer's form had
      # already told them the build was starting; no email is sent on the
      # failure path; the capability row sits in DynamoDB until its 30-day TTL
      # removes the evidence. The only trace was a red row in the Actions tab
      # that nobody watches.
      #
      # What this may NOT do is name the order. The bundle id is the download
      # credential and annotations and run summaries are public on a public
      # repository -- that was the leak fixed in the commit this builds on, and
      # tests/test_workflow_safety.py now fails if it comes back through a
      # helpful error message. So the public half says only that an order
      # failed and points at the run; the identity travels by SES, privately,
      # in the step below.
      - name: Say that a paid order failed
        if: ${{ failure() }}
        env:
          DISPATCH_KEY: ${{ inputs.dispatch_key }}
        run: |
          set -uo pipefail
          echo "::error::A paid program report bundle did not complete. The buyer was told the build had started and nothing else will tell them otherwise. The order is named in the alert emailed to SES_FROM, and in the program-bundles table; it is deliberately not printed here, because this log is public."
          {
            echo
            echo "## A paid order was not delivered"
            echo
            echo "- run group: \`${DISPATCH_KEY:-none}\`"
            echo
            echo "Re-running this workflow with the same inputs is the repair, and it is"
            echo "safe: the archive and the download link are both keyed on the bundle id,"
            echo "so a re-run fills the object the buyer's existing link already points at."
            echo "The inputs are not shown on this page; take them from the emailed alert."
          } >> "$GITHUB_STEP_SUMMARY"

      # Then mail it, which is where the order may be named: SES goes to the
      # operator, not to a public page. The Watchdog check is a six-hourly
      # sweep, not a pager, and this is the one place that knows which order
      # it was. `continue-on-error` covers only the mail: the run has already
      # failed and the annotation above is written whatever SES does. A
      # notification that cannot be sent must never stand in for the failure
      # it reports.
      - name: Mail the operator that an order failed
        if: ${{ failure() && vars.ARTIFACTS_BUCKET != '' && vars.SES_FROM != '' }}
        continue-on-error: true
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          CADENCE: ${{ inputs.cadence }}
          DELIVER_TO: ${{ inputs.deliver_to }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SES_FROM: ${{ vars.SES_FROM }}
        run: |
          set -uo pipefail
          body="A program report bundle run failed, so a paid order is undelivered.

          bundle id:  ${BUNDLE_ID}
          deliver to: ${DELIVER_TO}
          cadence:    ${CADENCE}
          run:        ${RUN_URL}

          Re-dispatch this workflow with the same inputs to repair it. The
          archive and the download link are keyed on the bundle id, so the
          re-run fills the object the buyer's link already points at."
          aws ses send-email --region "$AWS_REGION" \
            --from "$SES_FROM" --to "$SES_FROM" \
            --subject "GTFS Scorecard: a program bundle run failed" \
            --text "$body"

      - name: Keep the archive on the run
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: program-bundle-${{ inputs.dispatch_key || github.run_id }}
          path: |
            pipeline/bundle.zip
            pipeline/manifest.json
          if-no-files-found: warn
          retention-days: 30

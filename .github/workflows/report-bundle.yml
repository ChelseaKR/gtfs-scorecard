name: Program report bundle

# The program tier's fulfillment step (docs/program-plan.md, ADR 0049): render
# one program's branded board reports for a cohort of agencies, zip them with
# a manifest, put the archive behind a 30-day capability link, and email the
# link. GitHub Actions is the on-demand compute, the same way onboard.yml
# scores a feed on request, so the tier needs no always-on server.
#
# Dispatched by infra/program-bundle (the post-checkout setup Lambda, and the
# weekly refresh Lambda for subscriptions). It can also be dispatched by hand
# on main for a make-good: the repair for an undelivered order is a re-run
# with the same order_ref. Payment is settled before dispatch; this workflow
# never talks to Stripe.
#
# NOTHING ABOUT THE BUYER IS AN INPUT. This repository is public, and GitHub
# prints each step's environment -- including any value that came from a
# workflow_dispatch input -- in a run log anyone can read. An earlier shape of
# this workflow took the buyer's email address, the program name, the agency
# list, and the bundle id (the download capability) as inputs, and published
# every one of them into the run log for each order; two hand test runs on
# 2026-09-11 did exactly that before the tier had a real customer. The only
# input now is `order_ref`: a random 128-bit name for an object the setup
# Lambda wrote to the private artifacts bucket. On its own it grants nothing;
# reading the object needs this workflow's AWS role, which trusts runs on main
# only. Every value read from the object is registered with ::add-mask:: by
# the collect step before any later step can print it, so an error message
# that happens to quote an address or an agency id is masked too.
#
# Delivery degrades honestly. The archive is the paid deliverable and carries
# its own download capability, so nothing is kept on the run in any case: a
# run artifact of a public repository is published. Without the delivery
# configuration (ARTIFACTS_BUCKET, BUNDLE_API_BASE, SES_FROM) the run refuses
# to start rather than degrading, because the stored order lives in that
# bucket -- there is no build to fall back to, and an uploaded archive with no
# email reads as a delivered order everywhere else in this system. The repair
# for an undelivered order is a re-run with the same order_ref.

on:
  workflow_dispatch:
    inputs:
      order_ref:
        description: "32 lowercase hex characters naming a stored order; carries no buyer data"
        required: true
        type: string

permissions:
  contents: read

# Scoped per order rather than global: GitHub keeps only one pending run per
# concurrency group, so a shared group would let a third arrival evict a
# queued, paid order. Scoped to one order, an eviction can only ever drop a
# duplicate run of the same build. order_ref is safe to name here because it
# carries nothing: it is not the bundle id and is not derived from it.
concurrency:
  group: report-bundle-${{ inputs.order_ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # read the order and write the archive through AWS OIDC
    defaults:
      run:
        working-directory: pipeline
    steps:
      # A paid order has nowhere to go without these three, so their absence fails the run
      # (and the run's failure is what tells the owner) rather than building an archive nobody
      # can reach. Checked here rather than in each later step's `if:`: gated there, a blank
      # variable skipped delivery and the run still ended green with the archive sitting in S3,
      # which is precisely the evidence the daily reconciler reads as a delivered order.
      - name: Refuse to start without the delivery configuration
        shell: bash
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          BUNDLE_API_BASE: ${{ vars.BUNDLE_API_BASE }}
          SES_FROM: ${{ vars.SES_FROM }}
          ORDER_REF: ${{ inputs.order_ref }}
        run: |
          set -euo pipefail
          if [ -z "${ARTIFACTS_BUCKET}" ] || [ -z "${BUNDLE_API_BASE}" ] || [ -z "${SES_FROM}" ]; then
            echo "::error::ARTIFACTS_BUCKET, BUNDLE_API_BASE and SES_FROM must all be set as repository variables before an order can be fulfilled. See docs/program-plan.md."
            exit 1
          fi
          # An explicit class, not a range: bash's =~ ranges follow the locale.
          if ! [[ "${ORDER_REF}" =~ ^[0123456789abcdef]{32}$ ]]; then
            echo "::error::order_ref must be 32 lowercase hex characters."
            exit 1
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the locked environment
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      # The object is read into request.json and every buyer-supplied value in it is masked
      # before anything else runs. The masking happens inside Python reading the file, so no
      # value ever appears in a step's rendered script or environment block. This is the first
      # step that touches the order, and it must stay ahead of every step that could print
      # one of its values (tests/test_workflow_safety.py fails if a step overtakes it).
      - name: Collect the order and mask what it holds
        shell: bash
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          ORDER_REF: ${{ inputs.order_ref }}
        run: |
          set -euo pipefail
          aws s3 cp "s3://${ARTIFACTS_BUCKET}/program-requests/${ORDER_REF}.json" request.json --only-show-errors
          uv run python -m scorecard_pipeline.bundle_order mask request.json

      # The plan names which ids to hydrate and which were refused up front. The counts go to
      # the summary; the ids do not (they are masked by the step above in any case, and the
      # manifest inside the delivered archive is where the buyer reads the per-id detail).
      - name: Write the build plan
        shell: bash
        run: |
          set -euo pipefail
          uv run scorecard bundle --request request.json --plan plan.json
          {
            echo "## Program report bundle"
            echo
            echo "Fetching $(jq '.current | length' plan.json) current agencies;"
            echo "$(jq '.refused | length' plan.json) ids refused before the build (see manifest)."
            echo "Nothing identifying the order is shown on this page."
          } >> "$GITHUB_STEP_SUMMARY"

      # Only what the report reads: the index (history) and each requested
      # agency's current artifact. Not the whole corpus; a bundle is a hundred
      # files at most, and the daily run's full sync would take minutes.
      #
      # The checkout already carries a committed snapshot of data/artifacts,
      # which is the fallback when no bucket is configured. It must not be the
      # fallback when a bucket IS configured: that snapshot is re-materialized
      # by hand and runs weeks behind, so a `cp` that failed for one agency
      # would leave a stale grade in place and the report would print it as
      # today's, dressed in a fresh history from the index that was fetched
      # successfully. Delete each requested agency's copy first, so a failed
      # fetch becomes an id the manifest names rather than a wrong number
      # nobody can see is wrong.
      #
      # And retry, the way pages.yml retries its own sync. The free site gets
      # three attempts at the same objects; a paid bundle was getting one, so
      # a blip that costs the site nothing cost a buyer an agency. A 404 is
      # not a blip -- that agency has no published artifact -- so it is taken
      # at its word and not retried.
      #
      # The two outcomes are kept apart after the retries, because the buyer's
      # manifest cannot tell them apart. `scorecard bundle` classifies an id
      # with no artifact on disk as `not_published`, and the manifest and the
      # delivery email print its reason as "tracked, but no scorecard is
      # published for it yet". For a 404 that is the truth. For an S3 read
      # that failed three times it is a claim about the agency, manufactured
      # from a failed read of our own bucket, and the buyer -- who is paying
      # for a judgment about exactly that -- has no way to see the
      # difference. So a 404 continues the build and an unreadable object
      # fails the run: late is recoverable by a re-run with the same order_ref,
      # and the failure path is watched (watchdog.yml, and the "Say that a
      # paid order failed" step below). A wrong sentence about an agency is
      # delivered and believed.
      - name: Hydrate the requested artifacts from S3
        shell: bash
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp "s3://${ARTIFACTS_BUCKET}/data/artifacts/index.json" ../data/artifacts/index.json --only-show-errors
          fetch_latest() {
            local id="$1" attempt err
            for attempt in 1 2 3; do
              if err=$(aws s3 cp \
                  "s3://${ARTIFACTS_BUCKET}/data/artifacts/${id}/latest.json" \
                  "../data/artifacts/${id}/latest.json" --only-show-errors 2>&1); then
                return 0
              fi
              case "$err" in
                *"(404)"*|*"Not Found"*|*"does not exist"*)
                  echo "no published artifact in S3 for ${id}" >&2
                  return 1
                  ;;
              esac
              if [ "$attempt" -eq 3 ]; then
                echo "S3 read failed three times for ${id}: ${err}" >&2
                return 2
              fi
              echo "S3 read failed for ${id}; retrying (${attempt}/3)." >&2
              sleep $((attempt * 5))
            done
          }
          : > unhydrated.txt
          : > unreadable.txt
          jq -r '.current[]' plan.json | while read -r id; do
            mkdir -p "../data/artifacts/${id}"
            rm -f "../data/artifacts/${id}/latest.json"
            status=0
            fetch_latest "$id" || status=$?
            case "$status" in
              0) ;;
              1) printf '%s\n' "$id" >> unhydrated.txt ;;
              *) printf '%s\n' "$id" >> unreadable.txt ;;
            esac
          done
          if [ -s unhydrated.txt ]; then
            {
              echo
              echo "**Not hydrated from S3** for $(wc -l < unhydrated.txt | tr -d ' ') of the requested"
              echo "ids: S3 has no current artifact for them, and each is named in the buyer's"
              echo "manifest as not published, which is what it is. The ids are not listed here:"
              echo "this page is public and they are a paying program's caseload."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s unreadable.txt ]; then
            {
              echo
              echo "**S3 would not answer** for $(wc -l < unreadable.txt | tr -d ' ') of the"
              echo "requested ids after three attempts each. The ids are not listed here: this"
              echo "page is public and they are a paying program's caseload. Re-run this"
              echo "workflow with the same order_ref."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::S3 would not answer for one or more requested agencies after three attempts. Failing rather than building: an agency whose artifact could not be read renders in the buyer's manifest as \"tracked, but no scorecard is published for it yet\", which is a statement about that agency and would not be true. Re-run with the same order_ref."
            exit 1
          fi

      # Held to the cap the order was sold with, a second time: the setup route
      # enforced it before storing the order, and the render enforces it again
      # so a hand-edited stored order cannot ship more than was bought.
      - name: Render the bundle
        shell: bash
        run: |
          set -euo pipefail
          cap="$(uv run python -m scorecard_pipeline.bundle_order cap request.json)"
          uv run scorecard bundle --request request.json --max-agencies "${cap}" \
            --out bundle.zip --manifest manifest.json

      # program-bundles/ is outside the CloudFront allow-list and expires after
      # 30 days (infra/artifacts lifecycle). The only way to it is the download
      # route in infra/program-bundle, which presigns per click.
      - name: Upload the archive behind its capability key
        shell: bash
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          key="$(uv run python -m scorecard_pipeline.bundle_order archive-key request.json)"
          aws s3 cp bundle.zip "s3://${ARTIFACTS_BUCKET}/${key}" \
            --content-type application/zip --only-show-errors

      # Once the step above has run, the archive is in the bucket and the
      # buyer's only route to it is this email. The link is computed inside
      # Python from the environment, so the URL never appears in a command
      # line, and the buyer's address is read from the stored order there too.
      - name: Email the download link
        shell: bash
        env:
          BUNDLE_API_BASE: ${{ vars.BUNDLE_API_BASE }}
          SES_FROM: ${{ vars.SES_FROM }}
        run: |
          set -euo pipefail
          uv run --with boto3 python -m scorecard_pipeline.bundle_order email request.json manifest.json

      # What this may NOT do is name the order's contents: the bundle id is the
      # download capability, and annotations and run summaries are public on a
      # public repository. order_ref is safe to print because it carries
      # nothing -- it is a random name for the stored order, and reading that
      # object needs this workflow's AWS role. This says only that an order
      # failed and how to repair it.
      #
      # There is deliberately no email here. This step used to mail SES_FROM,
      # and SES_FROM is an address on a domain with no MX record, so that mail
      # was delivered nowhere: a notification that cannot arrive is the same
      # defect as no notification, wearing a coat. What replaces it is already
      # in place and does not need an address -- watchdog.yml reads this
      # workflow's conclusion every six hours, and the daily reconciler files
      # the undelivered order as a GitHub issue.
      - name: Say that a paid order failed
        if: ${{ failure() }}
        shell: bash
        env:
          ORDER_REF: ${{ inputs.order_ref }}
        run: |
          set -euo pipefail
          echo "::error::A paid program report bundle did not complete. The buyer was told the build had started and nothing else will tell them otherwise. Re-running this workflow on main with the same order_ref is the repair. Nothing else about the order is printed because this log is public; it is identified in the private bundles table and the reconciler's CloudWatch log."
          {
            echo
            echo "## A paid order was not delivered"
            echo
            echo "- order_ref: \`${ORDER_REF}\` (names the stored order; carries no buyer data)"
            echo
            echo "Re-running this workflow with the same order_ref is safe: the archive and the"
            echo "download link are both keyed on the bundle id inside the stored order, so a"
            echo "re-run fills the object the buyer's existing link already points at."
          } >> "$GITHUB_STEP_SUMMARY"

      # There is deliberately no upload-artifact step here, and adding one back
      # is a regression test failure (test_the_built_archive_is_never_kept_on
      # _the_run). A run artifact of this repository is published: this repo is
      # public, so every signed-in GitHub account has read access and can
      # download it for its whole retention window, and the REST artifact
      # listing answers unauthenticated.
      #
      # What an artifact would carry here is worse than a name: bundle.zip is
      # the paid deliverable, and request.json and manifest.json name the
      # buying program, its caseload, and the 32-hex bundle id that IS the
      # download capability (infra/program-bundle/setup_handler.py: "the
      # capability in the email is the credential"). Delivery does not need a
      # run artifact. The archive goes to program-bundles/<id>/bundle.zip in
      # the artifacts bucket, which is outside the CloudFront allow-list and
      # reachable only through the presigning download route, and the buyer
      # gets a link to that. A failed run is repaired by re-running this
      # workflow with the same order_ref, which is what the failure summary
      # above already says.
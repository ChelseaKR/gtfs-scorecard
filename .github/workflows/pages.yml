name: Deploy site

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PAGES_AWS_ROLE_ARN: ${{ secrets.PAGES_AWS_ROLE_ARN }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Deploy gate for the declared quality bar (CLAUDE.md: "Lighthouse
  # accessibility score >= 95"): render and assemble _site exactly as a11y.yml
  # does, serve it locally, and assert the score with Lighthouse CI. Thresholds
  # live in lighthouserc.json at the repo root; only the accessibility category
  # is asserted because that is the only category the >=95 claim covers (BL-12).
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - name: Install the pipeline
        working-directory: pipeline
        run: uv sync --locked
      - name: Render the static site
        working-directory: pipeline
        run: uv run scorecard render-site
      - name: Assemble the Pages site (mirrors deploy)
        run: |
          mkdir -p _site/data
          cp -r web/. _site/
          cp -r data/artifacts _site/data/artifacts
      - name: Authenticate to AWS (read-only, artifacts bucket)
        if: ${{ vars.ARTIFACTS_BUCKET != '' && env.PAGES_AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.PAGES_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
      - name: Sync published artifacts from S3
        if: ${{ vars.ARTIFACTS_BUCKET != '' && env.PAGES_AWS_ROLE_ARN != '' }}
        run: |
          # S3 as the artifact source of truth (docs/follow-ups.md), step 2:
          # the `cp -r data/artifacts` above already seeded _site with
          # whatever git still carries (a fork, or an S3 outage); this sync
          # only adds/refreshes on top of it and never deletes, so a sync
          # failure here degrades to that committed copy instead of failing
          # the deploy.
          # Corrected feed ZIPs are served from the artifact CDN and can be
          # hundreds of MB each; Pages needs the JSON/SVG/GeoJSON public data,
          # not a duplicate 2.7 GB binary mirror in every deployment artifact.
          aws s3 sync "s3://${{ vars.ARTIFACTS_BUCKET }}/data/artifacts" _site/data/artifacts \
            --exclude "*.zip" --only-show-errors \
            || echo "::warning title=S3 artifact sync failed::serving whatever data/artifacts git still carries"
      - name: Lighthouse CI (accessibility >= 95)
        run: |
          python3 -m http.server 8080 --directory _site &
          SRV=$!
          for _attempt in $(seq 1 30); do curl -sf http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          npx --yes @lhci/cli@0.14 autorun
          kill $SRV

  deploy:
    needs: lighthouse
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
      - name: Assemble static site
        run: |
          mkdir -p _site/data
          cp -r web/. _site/
          cp -r data/artifacts _site/data/artifacts
      # PAGES_AWS_ROLE_ARN is trusted for this job specifically because it
      # runs under the github-pages environment, which changes the OIDC
      # `sub` claim (infra/artifacts/github_oidc.tf, pages_read role).
      - name: Authenticate to AWS (read-only, artifacts bucket)
        if: ${{ vars.ARTIFACTS_BUCKET != '' && env.PAGES_AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.PAGES_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
      - name: Sync published artifacts from S3
        if: ${{ vars.ARTIFACTS_BUCKET != '' && env.PAGES_AWS_ROLE_ARN != '' }}
        run: |
          # See the matching step in the lighthouse job above: additive sync
          # on top of the committed fallback, never fails the deploy.
          aws s3 sync "s3://${{ vars.ARTIFACTS_BUCKET }}/data/artifacts" _site/data/artifacts \
            --exclude "*.zip" --only-show-errors \
            || echo "::warning title=S3 artifact sync failed::serving whatever data/artifacts git still carries"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment

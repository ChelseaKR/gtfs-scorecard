name: Deploy site

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PAGES_AWS_ROLE_ARN: ${{ secrets.PAGES_AWS_ROLE_ARN }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Deploy gate for the declared quality bar (CLAUDE.md: "Lighthouse
  # accessibility score >= 95"): render and assemble _site exactly as a11y.yml
  # does, serve it locally, and assert the score with Lighthouse CI. Thresholds
  # live in lighthouserc.json at the repo root; only the accessibility category
  # is asserted because that is the only category the >=95 claim covers (BL-12).
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - name: Install the pipeline
        working-directory: pipeline
        run: uv sync --locked
      - name: Authenticate to AWS (read-only, artifacts bucket)
        if: ${{ vars.ARTIFACTS_BUCKET != '' && env.PAGES_AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.PAGES_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}
      - name: Sync published artifacts from S3
        if: ${{ vars.ARTIFACTS_BUCKET != '' && env.PAGES_AWS_ROLE_ARN != '' }}
        run: |
          # S3 is authoritative. index.json already carries complete score
          # histories, so rendering needs each current artifact plus only the
          # two newest dated snapshots for finding diffs. This bounded set
          # avoids downloading the 400-day archive or CDN-hosted corrected ZIPs.
          today=$(date -u +%Y-%m-%d)
          yesterday=$(date -u -d yesterday +%Y-%m-%d)
          aws s3 sync "s3://${{ vars.ARTIFACTS_BUCKET }}/data/artifacts" data/artifacts \
            --exclude "*" \
            --include "directory.json" --include "index.json" \
            --include "scoring.json" --include "sensitivity.json" \
            --include "changes/*" --include "rollups/*" --include "run/*" \
            --include "*/latest.json" --include "*/badge.json" --include "*/badge.svg" \
            --include "*/conformance.json" --include "*/fixlog.json" \
            --include "*/geometry.geojson" \
            --include "*/${today}.json" --include "*/${yesterday}.json" \
            --only-show-errors
      - name: Render and assemble the Pages site
        run: |
          cd pipeline
          uv run scorecard render-site
          cd ..
          mkdir -p _site/data
          cp -r web/. _site/
          cp -r data/artifacts _site/data/artifacts
      - name: Lighthouse CI (accessibility >= 95)
        run: |
          python3 -m http.server 8080 --directory _site &
          SRV=$!
          for _attempt in $(seq 1 30); do curl -sf http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          npx --yes @lhci/cli@0.14 autorun
          kill $SRV
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: lighthouse
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment

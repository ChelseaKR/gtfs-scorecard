name: Validate one feed (diagnostic)

# Manual, ad hoc single-feed validator run for reliability diagnostics (issue
# #297): reproduce, or verify a fix for, a runner-killing validation without
# waiting for the next scheduled Daily/Intraday cycle to happen to include
# the feed in question. Read-only against the registry and the feed's own
# host; never touches S3, never deploys, never writes to main.

on:
  workflow_dispatch:
    inputs:
      agency:
        description: "registry agency id to validate (e.g. ovapi-netherlands)"
        required: true
        type: string
      # READ BEFORE SETTING EITHER NUMBER BELOW. These two inputs interact, and
      # the interaction is an easy and expensive trap.
      #
      # SCORECARD_VALIDATOR_MEMORY_MB becomes `prlimit --as`, which sets
      # RLIMIT_AS: a ceiling on the process's VIRTUAL ADDRESS SPACE, not on its
      # resident memory. A JVM reserves far more address space than the heap it
      # is asked for, so a ceiling chosen as if it were an RSS budget does not
      # bound a runaway — it stops the VM initializing at all, before any feed
      # is read. Keep the ceiling well clear of the heap.
      #
      # Observed live on 2026-08-29, run 33264844507: memory_limit_mb=6144 with
      # large_feed_heap=4g died 1.3 seconds in at 271 MB peak RSS, which is the
      # JVM failing to start, not the feed failing to validate. Production runs
      # 10240 against the default 6g heap, so leaving large_feed_heap empty is
      # what reproduces production. That pairing validated this feed in 3m30 at
      # 6.4 GB peak RSS on 2026-08-21 (run 32508141222) and died 2m24 in on
      # 2026-08-29 (run 33265338459), so a failure at these settings is about
      # the feed or the runner, not about the numbers.
      memory_limit_mb:
        description: "SCORECARD_VALIDATOR_MEMORY_MB: prlimit --as ceiling, in MiB. Bounds VIRTUAL ADDRESS SPACE, not RSS, so keep it well above the heap or the JVM will not start (6144 with a 4g heap does not). Production uses 10240. Empty = unbounded (pre-#297 behavior)."
        required: false
        default: ""
        type: string
      large_feed_heap:
        description: "SCORECARD_LARGE_FEED_HEAP override, e.g. 6g. Empty = validate.DEFAULT_LARGE_FEED_HEAP (6g), which is what production uses; leave it empty to reproduce production. Any value set here must stay well below the ceiling above."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Same ceiling as the Daily scorecard score job (issue #297): this is the
    # diagnostic for that job's failure mode, so it needs the same bound to
    # mean anything.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Runner resources (ground truth for sizing SCORECARD_VALIDATOR_MEMORY_MB)
        run: |
          {
            echo "## Runner resources"
            echo '```'
            free -h
            nproc
            # Azure mixes hardware generations across regions and even within
            # one, and a validation that finishes in 82s on one runner and is
            # still going at 450s on another is the central unexplained fact of
            # issue #297. The CPU model is one line and it was not being
            # recorded, so "the fast runs are on faster silicon" could not be
            # told apart from "the fast runs got a lucky GC".
            grep -m1 'model name' /proc/cpuinfo || true
            df -h /
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate the requested feed
        working-directory: pipeline
        env:
          # Passed as env vars rather than interpolated into the script below:
          # workflow_dispatch inputs are attacker-influenceable text as far as
          # a shell script is concerned, and the shell only ever sees them as
          # inert variable values this way, never as script text (zizmor:
          # template-injection).
          AGENCY: ${{ inputs.agency }}
          SCORECARD_VALIDATOR_MEMORY_MB: ${{ inputs.memory_limit_mb }}
          SCORECARD_LARGE_FEED_HEAP: ${{ inputs.large_feed_heap }}
        run: |
          set -uo pipefail
          echo "agency=$AGENCY"
          echo "SCORECARD_VALIDATOR_MEMORY_MB=${SCORECARD_VALIDATOR_MEMORY_MB:-<unbounded>}"
          echo "SCORECARD_LARGE_FEED_HEAP=${SCORECARD_LARGE_FEED_HEAP:-<default>}"

          # ------------------------------------------------------------------
          # Instrumentation for issue #297's runner death. Read this before
          # changing any of it; each piece exists because of a specific way the
          # evidence was lost.
          #
          # Everything below goes to THIS STEP'S STDOUT, which is the job log.
          # Nothing is written only to a file for a later upload step, because
          # `actions/upload-artifact` never runs when the runner is killed —
          # which is the failure mode being investigated. The Actions service
          # streams the job log as it is produced, so a line printed here is on
          # the server before the kill, and that is the whole point.
          #
          # `run_validator` calls `subprocess.run(..., capture_output=True)`,
          # which buffers the validator's stdout and stderr inside the Python
          # parent until the child returns. On a killed runner there is no
          # return, so the buffer dies with the process. That is why three
          # weeks of these deaths produced no Java output at all — the absence
          # is a property of the instrumentation, not evidence that the JVM was
          # healthy.
          # ------------------------------------------------------------------
          export SCORECARD_JVM_TEE="$RUNNER_TEMP/jvm-stdio.log"
          export SCORECARD_JVM_GCLOG="$RUNNER_TEMP/jvm-gc.log"
          SCORECARD_REAL_JAVA="$(command -v java)"
          export SCORECARD_REAL_JAVA
          : > "$SCORECARD_JVM_TEE"
          : > "$SCORECARD_JVM_GCLOG"

          # `validate.py:_java_binary()` already honours a SCORECARD_JAVA
          # override, so the validator subprocess can be wrapped from here
          # without touching production code — no change to validate.py,
          # scorecard.yml or refresh.yml, and the scheduled tiers keep logging
          # exactly as they do today.
          #
          # The wrapper still delivers both streams to the pipes
          # `subprocess.run` created, so the labelled both-streams RuntimeError
          # from #326 keeps reporting an ordinary validator failure unchanged;
          # it additionally copies them to a file the sampler drains into the
          # job log. Handing the wrapper an inherited descriptor instead was
          # not available: `subprocess.run` defaults to `close_fds=True`, so
          # anything above fd 2 is closed in the child.
          #
          # -Xlog:gc is injected here rather than in validate.py for the same
          # reason. One line per collection is what distinguishes "the JVM is
          # in a G1 spiral at its -Xmx ceiling" from "the platform killed a
          # healthy runner", and no run has ever carried it. It is identical
          # across every dispatch in this experiment, so it cannot skew a
          # comparison between them; it does mean none of these runs is
          # byte-identical to a production shard.
          cat > "$RUNNER_TEMP/java-tee" <<'WRAPPER'
          #!/usr/bin/env bash
          exec "$SCORECARD_REAL_JAVA" \
            "-Xlog:gc:file=$SCORECARD_JVM_GCLOG:time,uptime,level" \
            "$@" \
            > >(tee -a "$SCORECARD_JVM_TEE") \
            2> >(tee -a "$SCORECARD_JVM_TEE" >&2)
          WRAPPER
          chmod +x "$RUNNER_TEMP/java-tee"
          export SCORECARD_JAVA="$RUNNER_TEMP/java-tee"

          # 5-second sampler: host memory, kernel memory-pressure stalls, the
          # JVM's own RSS and address space, free disk, and whatever the JVM
          # has printed since the last tick. `systemd-oomd` kills on sustained
          # PSI pressure rather than on absolute exhaustion, so a runner can
          # die at 6.4 GiB peak RSS on a 15 GiB box; without /proc/pressure
          # that is invisible. Disk is included because it has never been
          # measured mid-run, only at job start.
          probe() {
            local out_off=0 gc_off=0 mem psi jpid jrss jvsz avail cur stamp
            while :; do
              stamp=$(date -u +%H:%M:%S)
              mem=$(free -m | awk '/^Mem:/{printf "mem_total=%s used=%s free=%s buffcache=%s avail=%s", $2, $3, $4, $6, $7} /^Swap:/{printf " swap_used=%s", $3}')
              psi=$(awk '{printf "%s(%s,%s) ", $1, $2, $3}' /proc/pressure/memory 2>/dev/null) || psi="psi=unavailable "
              avail=$(df -m --output=avail / 2>/dev/null | tail -1 | tr -d ' ')
              jpid=$(pgrep -x java 2>/dev/null | head -1)
              if [ -n "${jpid:-}" ] && [ -r "/proc/${jpid}/status" ]; then
                jrss=$(awk '/^VmRSS:/{print $2}' "/proc/${jpid}/status" 2>/dev/null)
                jvsz=$(awk '/^VmSize:/{print $2}' "/proc/${jpid}/status" 2>/dev/null)
                printf '[probe %s] %s | jvm pid=%s rss=%sM vsz=%sM | pressure %s| rootfs_avail=%sM\n' \
                  "$stamp" "$mem" "$jpid" "$(( ${jrss:-0} / 1024 ))" "$(( ${jvsz:-0} / 1024 ))" "$psi" "${avail:-?}"
              else
                printf '[probe %s] %s | jvm not running | pressure %s| rootfs_avail=%sM\n' \
                  "$stamp" "$mem" "$psi" "${avail:-?}"
              fi
              cur=$(stat -c %s "$SCORECARD_JVM_TEE" 2>/dev/null || echo 0)
              if [ "${cur:-0}" -gt "$out_off" ]; then
                tail -c "+$(( out_off + 1 ))" "$SCORECARD_JVM_TEE" | sed 's/^/[jvm-stdio] /'
                out_off=$cur
              fi
              cur=$(stat -c %s "$SCORECARD_JVM_GCLOG" 2>/dev/null || echo 0)
              if [ "${cur:-0}" -gt "$gc_off" ]; then
                tail -c "+$(( gc_off + 1 ))" "$SCORECARD_JVM_GCLOG" | sed 's/^/[gc] /'
                gc_off=$cur
              fi
              sleep 5
            done
          }
          probe &
          probe_pid=$!
          trap 'pkill -P "$probe_pid" 2>/dev/null; kill "$probe_pid" 2>/dev/null; true' EXIT

          if command -v /usr/bin/time >/dev/null; then
            /usr/bin/time -v uv run scorecard run --agency "$AGENCY" --force-fetch --skip-rt \
              2> >(tee "$RUNNER_TEMP/time.log" >&2)
          else
            uv run scorecard run --agency "$AGENCY" --force-fetch --skip-rt \
              2>&1 | tee "$RUNNER_TEMP/time.log"
          fi
          status=$?
          {
            echo "## Result"
            echo "exit status: $status"
            echo '```'
            grep -E "Maximum resident set size|Elapsed \(wall clock\)|Exit status" "$RUNNER_TEMP/time.log" || true
            echo '```'
            echo "## GC"
            echo "collections: $(grep -c 'Pause' "$SCORECARD_JVM_GCLOG" 2>/dev/null || echo 0)"
            echo "full pauses: $(grep -c 'Pause Full' "$SCORECARD_JVM_GCLOG" 2>/dev/null || echo 0)"
            echo '```'
            tail -n 25 "$SCORECARD_JVM_GCLOG" 2>/dev/null || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Runs only when the runner survived. A killed runner never reaches this
      # step, which is exactly why the sampler above streams to the job log
      # instead of relying on anything post-hoc. Kept because a kernel OOM kill
      # of the validator alone (rather than of the runner agent) would leave a
      # message here and nowhere else.
      - name: Kernel post-mortem (only reachable if the runner survived)
        if: ${{ always() }}
        run: |
          set -uo pipefail
          echo "## dmesg, memory-related lines"
          sudo dmesg -T 2>/dev/null | grep -iE 'oom|killed process|out of memory|memory cgroup' | tail -40 || echo "none"
          echo "## systemd-oomd"
          journalctl -u systemd-oomd --no-pager -n 40 2>/dev/null || echo "unavailable"
          echo "## final free / df"
          free -m || true
          df -m / || true

      - name: Retain the validator report for inspection
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: validate-one-feed-${{ inputs.agency }}-${{ github.run_id }}
          path: |
            data/artifacts/${{ inputs.agency }}/
            data/raw/${{ inputs.agency }}/
          if-no-files-found: warn
          retention-days: 14

# SEC-36/37, CICD-03/11/21: OpenSSF Scorecard, uploaded to code scanning so
# regressions show up next to CodeQL/Semgrep findings instead of a separate
# dashboard nobody checks. Uses only the default GITHUB_TOKEN (repo_token
# defaults to it) — some checks (notably Branch-Protection detail) score
# lower without a PAT with repo-admin read; provisioning that PAT secret is a
# live write action left to the repo owner, same as the standards-pin gate's
# STANDARDS_REPO_TOKEN.
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 7 * * 2" # weekly, Tuesday
  workflow_dispatch: {}

permissions: read-all

# Cancel a superseded analysis when main moves again before it finishes;
# the newer run re-scores the same repo state and more.
concurrency:
  # `github.ref` is `refs/pull/N/merge` on a pull request, so grouping by it cancels
  # superseded runs of the SAME pull request. That is the intent, and the saving, and it
  # is kept.
  #
  # On a push it is `refs/heads/main` for EVERY commit, so consecutive pushes to main
  # shared one group and the second cancelled the first outright. Flipping
  # `cancel-in-progress` to false does not fix it either: a queued run is then evicted
  # from the pending slot by the next arrival. Both roads end with a commit on main whose
  # only check-run is `cancelled`, and a cancelled run is no signal at all — not a pass,
  # not a failure, and easy to misread as either. Two commits lost their verdict this way
  # on 2026-09-06.
  #
  # So a push is grouped by its own SHA and cancels nothing: one commit, one verdict.
  group: openssf-scorecard-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Job-level permissions replace, not merge with, the workflow-level
      # block above — contents: read must be repeated here.
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@99c09fe975337306107572b4fdf4db224cf8e2f2 # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif

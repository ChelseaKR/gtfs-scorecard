name: Intraday refresh

# The cheap half of the two-tier cadence (ADR 0010). The daily "Daily scorecard"
# job re-validates every feed; this job runs more often and does only the cheap
# work: detect which feeds changed or went down (a conditional GET, no validator),
# re-score just those, and refresh every feed's expiry countdown from the calendar
# data already on hand. Cost stays flat as the registry grows because the Java
# validator only runs on the handful of feeds that actually changed.

on:
  schedule:
    # Every three hours. Cadence tiers (ADR 0010) decide which feeds are
    # actually checked each cycle: priority feeds (realtime, near expiry) every
    # cycle, the stable long tail spread once per six-hour period.
    #
    # This interval must stay in step with `REFRESH_STEP_HOURS` in
    # pipeline/src/scorecard_pipeline/cadence.py, which the due-list arithmetic
    # depends on, and with `INTRADAY_REFRESH_CRON` in status_commitment.py,
    # which is published verbatim on /status/ and in api/v1/status.json.
    # `test_status_commitment.py` reads this file and fails if they drift.
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same backstop as the daily workflow. This tier runs the Java validator only
  # on feeds that actually changed, but "fewer feeds" is not "no large feeds":
  # a changed `large_feed` lands here too, so it can take a runner down the same
  # way. See the note in scorecard.yml for why 10240 and what it does not claim.
  SCORECARD_VALIDATOR_MEMORY_MB: "10240"

jobs:
  refresh:
    runs-on: ubuntu-latest
    # RELIABILITY (issues #297, #390): until #297 there was no bound short of
    # the platform's 360-minute default. #297 set 240 against an observed "~70
    # to ~137 minutes", a figure written once that the job then outgrew and
    # nothing recomputed. Re-measured 2026-09-13 over the 100 scheduled runs
    # from 2026-09-01T09:33Z to 2026-09-13T18:30Z: successful runs took 56.6
    # to 154.1 minutes (median 87.3, n=84), the longest run of any conclusion
    # took 170.1 (a failure), and no run was stopped at its bound. How long a
    # cycle takes still depends on how many feeds are due (cadence tiers, ADR
    # 0010).
    #
    # 175 sits above every one of those runs and below the 180-minute cron.
    # 240 did not. A bound above the cadence cannot mean "this run has lost its
    # schedule": by the time it fires the next cycle has already started, and
    # `artifacts-publish` is serial with `cancel-in-progress: false`, so a third
    # arrival evicts the queued run rather than the wedged one.
    #
    # What no number can do is stated rather than implied. GitHub defers
    # scheduled fires unevenly, and consecutive fires in the same window were as
    # little as 114.2 minutes apart (median 181.3, longest 226.5). No bound sits
    # below that and above a 154-minute run, so this catches a wedged runner
    # (a runner killed validating a large feed, as in #297) and a run that has
    # outlived the nominal cadence, not a compressed gap. A faster job or a
    # longer cron fixes that, and which one is an owner decision.
    #
    # This number is now read. Watchdog's "No scheduled publish job is running
    # up against its own bound" compares each run's duration with it, and
    # pipeline/tests/test_workflow_safety.py holds it between the measured
    # runtime and the cadence.
    #
    # Re-measured 2026-09-18, when that check failed on run 35316236534 (160
    # of 175 minutes), and answered by trimming the work rather than moving
    # the bound. From 2026-09-14 to 2026-09-18 every cycle's publish was
    # refused (fixed by #464), so no cycle saved its liveness state: each one
    # re-found the same growing backlog (234 to 384 changed feeds), re-ran the
    # whole day's freshness sweep (~25 minutes), and re-scored until the
    # rescore deadline pinned the job at ~160 minutes. Before that window,
    # cycles took 64-128 minutes (2026-09-11..13); the two after it took 141
    # and 100 as the backlog drained. Most of every cycle was two serial
    # steps waiting: the liveness sweep (23-45 minutes) on one server at a
    # time, and the rescore (31-94) on servers and realtime sampling windows.
    # Both now overlap that waiting (see each step). Replaying the measured
    # per-feed timings of eight cycles through the new rescore took each from
    # 33-94 minutes to 10-49. The bound stays at 175 so the watchdog's 90%
    # line keeps meaning "this job has outgrown its cadence".
    timeout-minutes: 175
    concurrency:
      group: artifacts-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # publish refreshed artifacts through AWS OIDC
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          python-version: "3.12"

      # RELIABILITY: the per-feed rescore loop further down has no bound of its
      # own, so a large due batch (more agencies now carry a realtime feed
      # than when 175 was last measured) can run this whole job out to its
      # job-level timeout-minutes with the loop still mid-agency. A job killed
      # by timeout-minutes never reaches the reindex/rollups step or the S3
      # publish step after it, so every feed already re-scored that cycle is
      # discarded along with the ones still queued -- the loop needs its own
      # wall-clock deadline, read from when this job actually started, to stop
      # taking on new agencies while enough of the budget remains for the
      # steps after it.
      - name: Record job start time
        run: echo "job_started_epoch=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Authenticate to AWS
        if: ${{ vars.ARTIFACTS_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Hydrate current artifacts from S3
        if: ${{ vars.ARTIFACTS_BUCKET != '' }}
        run: |
          today=$(date -u +%Y-%m-%d)
          yesterday=$(date -u -d yesterday +%Y-%m-%d)
          aws s3 sync "s3://${{ vars.ARTIFACTS_BUCKET }}/data/artifacts" data/artifacts \
            --exclude "*" --include "index.json" \
            --include "*/latest.json" \
            --include "*/${today}.json" --include "*/${yesterday}.json" \
            --only-show-errors
          aws s3 sync "s3://${{ vars.ARTIFACTS_BUCKET }}/cache/fixlog" data/artifacts \
            --only-show-errors
          aws s3 cp "s3://${{ vars.ARTIFACTS_BUCKET }}/data/liveness.json" \
            data/liveness.json --only-show-errors || true

      - name: Select the feeds due this cycle
        working-directory: pipeline
        run: uv run scorecard cadence --out "$RUNNER_TEMP/due.txt"

      # Hosts are checked side by side and each host's feeds one at a time, so
      # no agency's server has two requests from this sweep in flight: the
      # load the serial sweep put on it, arriving no faster. Serial, this step
      # took 44-45 minutes a cycle on 2026-09-18 for ~1,500 due feeds, most of
      # it waiting on one server at a time. Sixteen lanes let the ~500 quiet
      # hosts finish behind the few busy ones, and the busiest sets the floor:
      # api.gtfs-data.jp carries 505 registered feeds at about a second a
      # check. The baseline is the state before this sweep, for the rescore
      # to put back any feed it defers (`scorecard rescore --liveness-baseline`).
      - name: Detect changed and unreachable feeds (due subset)
        working-directory: pipeline
        run: |
          uv run scorecard liveness --apply \
            --only "$RUNNER_TEMP/due.txt" \
            --workers 16 \
            --baseline-out "$RUNNER_TEMP/liveness.before.json" \
            --changed-out "$RUNNER_TEMP/changed.txt"

      # Export fingerprints are read by `export_diff` (exportdiff.py), which runs
      # inside `scorecard run` and therefore only for the feeds this cycle
      # actually re-scores. Hydrating the whole prefix pulled ~2,200 objects and
      # ~82 MB out of S3 every cycle to serve the handful of feeds that changed;
      # fetch them by exact key instead, once the changed list exists. A feed
      # with no stored fingerprint simply has no diff to report, which is the
      # same behavior as its first ever run.
      - name: Hydrate export fingerprints for the changed feeds
        if: ${{ vars.ARTIFACTS_BUCKET != '' }}
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        #
        # Eight copies at a time. One `aws s3 cp` per feed took about a second
        # and a half, which serially was 5-9 minutes a cycle while 200-400
        # feeds were changed (2026-09-14..18). `|| true` is per object, as it
        # was in the loop this replaces: a missing fingerprint is the normal
        # first-run case, and a feed without one reports no diff.
        run: |
          set -euo pipefail
          mkdir -p data/cache/structure
          [ -s "$RUNNER_TEMP/changed.txt" ] || exit 0
          # The single quotes are the point: the child shell expands $1 per id.
          # shellcheck disable=SC2016
          xargs -P 8 -n 1 sh -c '
            aws s3 cp "s3://${ARTIFACTS_BUCKET}/cache/structure/$1.json" \
              "data/cache/structure/$1.json" --only-show-errors || true
          ' fingerprint < "$RUNNER_TEMP/changed.txt"

      - name: Refresh expiry from calendar data (no fetch, no validator)
        working-directory: pipeline
        run: |
          uv run scorecard freshness-sweep --apply \
            --changed-out "$RUNNER_TEMP/swept.txt"

      # `scorecard rescore` (pipeline/src/scorecard_pipeline/rescore.py) is
      # the loop that used to be written out here, with the same outcome
      # counting, deadline, floor and annotations, and unit tests in place of
      # string checks on this file. What it adds is overlap. Measured
      # 2026-09-18 on run 35345841643, the serial loop spent 48.0 minutes on
      # 91 feeds, and only 16.5 of them validating and scoring: the rest was
      # 25 realtime sampling windows (24.2), interpreter start-up (4.8) and
      # downloads (2.4). Several runs are now in flight at once, and they take
      # turns at validating and scoring through the heavy lock, so the part
      # that needs memory still runs one feed at a time. A `large_feed` runs
      # with nothing else in flight, and two feeds that share a host are
      # never in flight together.
      #
      # The floor is the one scorecard.yml has (its "Verify shard artifacts
      # before publishing" step). Before it, every non-zero exit here became
      # an `echo`, so an intraday cycle in which every changed feed failed to
      # re-score still ran reindex, rollups, render-site, the S3 publish and
      # the Pages deploy, and reported success. Republishing yesterday's
      # corpus under today's deployment timestamp is the one outcome a
      # refresh must not report as a refresh, so a cycle that attempted feeds
      # and re-scored none exits 1. A cycle that deferred everything to the
      # budget (nothing attempted) is not that: it still applied the freshness
      # sweep and publishes that.
      - name: Re-score only the feeds that changed
        working-directory: pipeline
        env:
          # Start no new agency once this many seconds have elapsed since the
          # job began, leaving the rest of `timeout-minutes: 175` for the two
          # steps after this one: rebuilding the index and rollups, and
          # publishing to S3. 9300s = 155 minutes; measured 2026-09-14, those
          # two steps plus the AWS credential renewal between them took 2-4
          # minutes on every run recorded. Runs already in flight at the
          # deadline finish, as the serial loop's current feed did, and their
          # heavy parts queue on the lock: measured 2026-09-11..18 over 2,023
          # re-scores of feeds that are not `large_feed`, that part took 62s at
          # the 99th percentile and 176s at most, so four in flight cost well
          # under the 20 minutes of slack. A deferred feed keeps its last good
          # artifact and its liveness record is put back as it was before this
          # cycle's sweep, so its next check reads it as changed again; the
          # daily `scorecard.yml` run re-validates every canonical feed at
          # least once every 24h either way.
          REFRESH_RESCORE_DEADLINE_SECONDS: "9300"
          # Runs in flight at once. The overlap is waiting (downloads and
          # sampling windows), not memory, so this is not the runner's core
          # count. Replaying eight measured cycles, three workers left 2-5
          # minutes on the table against four, and six or eight did no better.
          REFRESH_RESCORE_WORKERS: "4"
        run: |
          set -euo pipefail
          uv run scorecard rescore \
            --ids "$RUNNER_TEMP/changed.txt" \
            --workers "$REFRESH_RESCORE_WORKERS" \
            --started-epoch "$job_started_epoch" \
            --budget-seconds "$REFRESH_RESCORE_DEADLINE_SECONDS" \
            --heavy-lock "$RUNNER_TEMP/rescore-heavy.lock" \
            --liveness-baseline "$RUNNER_TEMP/liveness.before.json" \
            --deferred-out "$RUNNER_TEMP/deferred.txt"

      - name: Rebuild index and rollups
        working-directory: pipeline
        run: |
          uv run scorecard reindex
          uv run scorecard rollups
          uv run scorecard render-site

      # Feed checks and re-scoring can run longer than the default one-hour
      # OIDC session. Renew immediately before the first public write so a
      # healthy refresh cannot fail at publication with ExpiredToken.
      - name: Renew AWS credentials before publishing
        if: ${{ vars.ARTIFACTS_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Publish refreshed artifacts to S3
        if: ${{ vars.ARTIFACTS_BUCKET != '' }}
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          set -euo pipefail
          artifact_uri="s3://${ARTIFACTS_BUCKET}/data/artifacts"
          sort -u "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/swept.txt" \
            > "$RUNNER_TEMP/refreshed.txt"

          public_stage="$RUNNER_TEMP/public-artifacts"
          fixlog_stage="$RUNNER_TEMP/private-fixlogs"
          structure_stage="$RUNNER_TEMP/private-structures"
          rm -rf "$public_stage" "$fixlog_stage" "$structure_stage"
          mkdir -p "$public_stage" "$fixlog_stage" "$structure_stage"
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            # Stage the selected public files locally so one parallel S3 sync
            # replaces thousands of serial AWS CLI processes.
            mkdir -p "$public_stage/$id"
            rsync -a \
              --exclude "validator-cache.json" --exclude "structure.json" \
              --exclude "fixlog.json" --exclude "corrected.zip" \
              "data/artifacts/${id}/" "$public_stage/$id/"
            if [ -f "data/artifacts/${id}/fixlog.json" ]; then
              mkdir -p "$fixlog_stage/$id"
              cp "data/artifacts/${id}/fixlog.json" "$fixlog_stage/$id/fixlog.json"
            fi
            if [ -f "data/cache/structure/${id}.json" ]; then
              cp "data/cache/structure/${id}.json" "$structure_stage/${id}.json"
            fi
          done < "$RUNNER_TEMP/refreshed.txt"

          # Only feeds detected as changed or actually freshness-swept are in
          # the staging tree. Never traverse/upload the full public corpus.
          #
          # Not `aws s3 sync`: it transfers when the local mtime is newer than
          # the object, and CI checks out fresh every run, so every staged file
          # always looked newer. A refreshed feed's directory carries its whole
          # dated history, so the sync re-PUT that history on every cycle even
          # though a dated artifact cannot change once written. Rewriting an
          # object also drops its tags and resets its age, so the bucket's
          # expire-dated-artifacts lifecycle rule -- which filters on
          # artifact-class=dated -- could never fire on the history this step
          # kept touching, and the pipeline was paying for PUTs to defeat its
          # own retention. `publish-artifacts` (the same publisher the daily
          # collect job uses, .github/workflows/scorecard.yml) compares the
          # local MD5 against each object's ETag and uploads on any doubt.
          # Dated evidence remains additive. Reindex's retirement manifest is
          # the bounded exception and can delete only fixed mutable filenames
          # for ids no longer in the current registry catalog.
          uv run --project pipeline --with boto3 scorecard publish-artifacts \
            --root "$public_stage" \
            --bucket "$ARTIFACTS_BUCKET" --prefix data/artifacts \
            --retirement-manifest data/artifacts/.retired-current-artifacts.json \
            --exclude "*/validator-cache.json" --exclude "*/structure.json" \
            --exclude "*/fixlog.json" --exclude "*/corrected.zip" \
            --cache-control "max-age=300"

          # Reindex/rollups produce a small bounded aggregate set. index.json
          # is the public commit pointer and is uploaded last.
          aws s3 cp data/artifacts/directory.json "${artifact_uri}/directory.json" \
            --cache-control "max-age=300" --only-show-errors
          aws s3 cp data/artifacts/scoring.json "${artifact_uri}/scoring.json" \
            --cache-control "max-age=300" --only-show-errors
          aws s3 sync data/artifacts/rollups "${artifact_uri}/rollups" \
            --cache-control "max-age=300" --only-show-errors
          aws s3 sync data/artifacts/changes \
            "${artifact_uri}/changes" \
            --delete --cache-control "max-age=300" --only-show-errors
          aws s3 cp data/liveness.json \
            "s3://${ARTIFACTS_BUCKET}/data/liveness.json" \
            --cache-control "max-age=300" --only-show-errors
          aws s3 cp data/artifacts/index.json "${artifact_uri}/index.json" \
            --cache-control "max-age=300" --only-show-errors

          # Persist comparison memory only after every public write succeeds.
          aws s3 sync "$fixlog_stage" \
            "s3://${ARTIFACTS_BUCKET}/cache/fixlog" --only-show-errors
          aws s3 sync "$structure_stage" \
            "s3://${ARTIFACTS_BUCKET}/cache/structure" --only-show-errors

  # Refreshes do not write to main, so deploy the newly published S3 state
  # explicitly after the refresh.
  deploy:
    needs: refresh
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      # Data refresh: performance budgets warn instead of blocking, so a
      # Lighthouse variance cannot stale the pages (FIX-14). Accessibility
      # still blocks.
      perf_gate: advisory
    secrets:
      PAGES_AWS_ROLE_ARN: ${{ secrets.PAGES_AWS_ROLE_ARN }}
      POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}

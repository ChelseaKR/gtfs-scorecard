name: Intraday refresh

# The cheap half of the two-tier cadence (ADR 0010). The daily "Daily scorecard"
# job re-validates every feed; this job runs more often and does only the cheap
# work: detect which feeds changed or went down (a conditional GET, no validator),
# re-score just those, and refresh every feed's expiry countdown from the calendar
# data already on hand. Cost stays flat as the registry grows because the Java
# validator only runs on the handful of feeds that actually changed.

on:
  schedule:
    # Hourly. Cadence tiers (ADR 0010) decide which feeds are actually checked
    # each hour: priority feeds (realtime, near expiry) every cycle, the stable
    # long tail spread once per six-hour period.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the small liveness fallback only
      id-token: write # publish refreshed artifacts through AWS OIDC
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Authenticate to AWS
        if: ${{ vars.ARTIFACTS_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      - name: Hydrate current artifacts from S3
        if: ${{ vars.ARTIFACTS_BUCKET != '' }}
        run: |
          today=$(date -u +%Y-%m-%d)
          yesterday=$(date -u -d yesterday +%Y-%m-%d)
          aws s3 sync "s3://${{ vars.ARTIFACTS_BUCKET }}/data/artifacts" data/artifacts \
            --exclude "*" --include "index.json" \
            --include "*/latest.json" --include "*/fixlog.json" \
            --include "*/${today}.json" --include "*/${yesterday}.json" \
            --only-show-errors

      - name: Select the feeds due this cycle
        working-directory: pipeline
        run: uv run scorecard cadence --out "$RUNNER_TEMP/due.txt"

      - name: Detect changed and unreachable feeds (due subset)
        working-directory: pipeline
        run: |
          uv run scorecard liveness --apply \
            --only "$RUNNER_TEMP/due.txt" \
            --changed-out "$RUNNER_TEMP/changed.txt"

      - name: Refresh expiry from calendar data (no fetch, no validator)
        working-directory: pipeline
        run: uv run scorecard freshness-sweep --apply

      - name: Re-score only the feeds that changed
        working-directory: pipeline
        run: |
          changed="$RUNNER_TEMP/changed.txt"
          [ -s "$changed" ] || { echo "No changed feeds to re-score."; exit 0; }
          # A single feed's vendor outage must not abort the batch; warn and move on.
          while read -r id; do
            [ -n "$id" ] || continue
            echo "::group::rescore $id"
            uv run scorecard run --agency "$id" \
              || echo "::warning title=rescore failed::$id kept its last good artifact"
            echo "::endgroup::"
          done < "$changed"

      - name: Rebuild index and rollups
        working-directory: pipeline
        run: |
          uv run scorecard reindex
          uv run scorecard rollups

      - name: Publish refreshed artifacts to S3
        if: ${{ vars.ARTIFACTS_BUCKET != '' }}
        run: |
          aws s3 sync data/artifacts "s3://${{ vars.ARTIFACTS_BUCKET }}/data/artifacts" \
            --cache-control "max-age=300" --only-show-errors

      - name: Commit the refresh
        run: |
          git config user.name "scorecard-bot"
          git config user.email "actions@users.noreply.github.com"
          # Scored artifacts and generated pages publish from S3/Pages. Git keeps
          # only this small liveness fallback, so a scheduled run cannot replay
          # thousands of stale generated files over a newly merged feature.
          paths=(data/liveness.json)
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "No changes this cycle."
            exit 0
          fi
          git commit -m "chore(data): intraday refresh"
          # main can move during the run. Replay only the liveness file on top
          # of it; scored artifacts and generated pages never enter this commit.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (main moved); replaying liveness onto latest main ($attempt)"
            git fetch origin main
            ours=$(git rev-parse HEAD)
            git reset --hard origin/main
            git restore --source="$ours" --staged --worktree -- "${paths[@]}"
            if git diff --cached --quiet; then
              echo "latest main already carries these artifacts; nothing to push."
              exit 0
            fi
            git commit -m "chore(data): intraday refresh"
            sleep 3
          done
          echo "still rejected after 5 retries; failing so the lost cycle is visible."
          exit 1

  # GITHUB_TOKEN pushes do not trigger the push-driven Pages workflow, so deploy
  # explicitly after the refresh.
  deploy:
    needs: refresh
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

name: OTP routing QA

# Weekly routing QA against a containerized OpenTripPlanner (ADR 0014). The
# select job picks the best and worst scored feeds from the committed index —
# the same ranking the national pulse shows — and fans out one job per feed.
# Each job downloads that feed, builds an OTP graph with the public container,
# serves it, and asserts that sample origin/destination trips return
# itineraries. OTP is a heavy Java service, so this stays a small weekly batch
# (a handful of feeds, a few pairs each), never part of the daily run. Also
# dispatchable by hand to widen the sample.

on:
  schedule:
    # 14:07 UTC Mondays, after the weekend's daily runs have settled the index.
    - cron: "7 14 * * 1"
  workflow_dispatch:
    inputs:
      count:
        description: "feeds per cohort (best and worst)"
        default: "2"
      pairs:
        description: "number of origin/destination pairs to test per feed"
        default: "5"

permissions:
  contents: read

env:
  # Pinned by digest (SEC-25 residue): tag 2.5.0 resolved 2026-07-05.
  OTP_IMAGE: docker.io/opentripplanner/opentripplanner@sha256:472509f359ed06624c1c95b3afad61374e2a64ca2b9c78758d33695c584a4e07

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      feeds: ${{ steps.select.outputs.feeds }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          python-version: "3.12"
      - name: Pick the best and worst scored feeds
        id: select
        working-directory: pipeline
        env:
          COUNT: ${{ github.event.inputs.count || '2' }}
        run: echo "feeds=$(uv run scorecard otp-batch --select best-worst --count "$COUNT")" >> "$GITHUB_OUTPUT"

  route:
    needs: select
    runs-on: ubuntu-latest
    # Graph build + server start for a small feed is minutes; the timeout only
    # guards against a hung container.
    timeout-minutes: 30
    strategy:
      # One fetched feed failing to route is exactly the signal this batch
      # exists to catch; it must not cancel the other feeds' runs. A feed that
      # cannot be downloaded, or that OTP cannot parse into a graph, is reported
      # as an upstream result instead: warning, step summary, no red run.
      fail-fast: false
      matrix:
        feed: ${{ fromJSON(needs.select.outputs.feeds) }}
    name: route (${{ matrix.feed.cohort }} ${{ matrix.feed.feed_id }})
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch the feed
        id: fetch
        env:
          FEED_URL: ${{ matrix.feed.feed_url }}
        run: |
          mkdir -p otp-work
          if curl -fsSL --retry 3 "$FEED_URL" -o otp-work/feed.gtfs.zip; then
            jq -n '{transitFeeds: [{type: "gtfs", source: "feed.gtfs.zip", feedId: "qa"}]}' \
              > otp-work/build-config.json
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The selected GTFS feed could not be downloaded; skipping routing QA for this candidate."
            echo "### Skipped ${{ matrix.feed.feed_id }}" >> "$GITHUB_STEP_SUMMARY"
            echo "The upstream GTFS URL was unavailable during this run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build the OTP graph
        id: build
        if: steps.fetch.outputs.available == 'true'
        run: |
          set -o pipefail
          status=0
          # The log goes beside the work directory, not inside it: OTP loads
          # every file it finds under /var/opentripplanner.
          docker run --rm -v "$PWD/otp-work:/var/opentripplanner" "$OTP_IMAGE" \
            --build --save 2>&1 | tee otp-build.log || status=$?
          if [ "$status" -eq 0 ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "built=false" >> "$GITHUB_OUTPUT"
          # OTP refuses to start on a feed whose tables it cannot parse, which is
          # a result about the feed, not a broken run. otp-build-check reads the
          # log and exits non-zero for anything else (image pull, memory, disk,
          # an OTP crash with no GTFS parsing error), so those still fail here.
          ( cd pipeline && uv run scorecard otp-build-check \
              --log "$GITHUB_WORKSPACE/otp-build.log" --exit-code "$status" ) \
            >> "$GITHUB_OUTPUT"
      - name: Record a feed OTP could not load
        if: steps.build.outputs.outcome == 'feed-unbuildable'
        env:
          FEED_ID: ${{ matrix.feed.feed_id }}
          DETAIL: ${{ steps.build.outputs.detail }}
        run: |
          echo "::warning title=OTP could not build a graph::${FEED_ID}: ${DETAIL}"
          {
            echo "### ${FEED_ID}: OTP could not build a graph"
            echo
            echo "${DETAIL}"
            echo
            echo "Routing QA is recorded as not testable for this feed this week."
            echo "The same parsing problem is on the agency's scorecard, where the fix belongs."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Serve the graph
        if: steps.build.outputs.built == 'true'
        run: |
          docker run -d --name otp -p 8080:8080 \
            -v "$PWD/otp-work:/var/opentripplanner" "$OTP_IMAGE" --load --serve
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/otp >/dev/null 2>&1; then
              echo "OTP is up"
              exit 0
            fi
            sleep 5
          done
          echo "OTP never became ready"
          docker logs otp
          exit 1
      - name: Plan sample trips through OTP
        id: plan
        if: steps.build.outputs.built == 'true'
        working-directory: pipeline
        env:
          PAIRS: ${{ github.event.inputs.pairs || '5' }}
          FEED_ID: ${{ matrix.feed.feed_id }}
        run: |
          set -o pipefail
          # A feed with no service on today's date cannot answer a routing
          # question. `scorecard otp` records that and exits 0, so note it here
          # instead of letting the step read as a clean routing pass.
          uv run scorecard otp --base http://127.0.0.1:8080 --allow-loopback \
            --feed ../otp-work/feed.gtfs.zip --pairs "$PAIRS" 2>&1 | tee otp-plan.log
          if grep -q "Routing QA not testable" otp-plan.log; then
            {
              echo "### ${FEED_ID}: no service to sample today"
              echo
              echo "The feed published no active trips with distinct endpoints on this run's date,"
              echo "so routing was not exercised. Calendar coverage is reported on the scorecard."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: OTP logs on failure
        if: failure()
        run: |
          if docker container inspect otp >/dev/null 2>&1; then
            docker logs otp
          else
            echo "The OTP server container never started, so it has no logs."
            echo "Look at the graph build step above for what stopped this run."
          fi

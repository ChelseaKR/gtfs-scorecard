name: Discover moved feeds

# Weekly check of tracked feeds against the Mobility Database
# (docs/feature-roadmap.md, "discover on a schedule"): every expired feed's URL,
# and every tracked record the catalog has retired in favour of another. The
# reports are always uploaded as artifacts. When a feed's canonical URL has
# actually moved, or the catalog has replaced a record we publish, the job
# rewrites the affected manifest-listed registry shard and opens a pull request
# for a human to review; it never edits the registry on its own.

on:
  schedule:
    # Mondays 14:00 UTC, after the daily scorecard refresh
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the registry/report change on a branch
      pull-requests: write # open the review PR
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
        working-directory: pipeline

      - name: Check expired feeds against the Mobility Database
        working-directory: pipeline
        run: uv run scorecard discover --expired --apply --out ../docs/feed-discovery.md

      # The catalog also retires whole feed records and names what replaced
      # them. Left unread, the retired record keeps publishing a current grade
      # beside its successor and one agency carries two. Same review path as
      # the moved-URL check: the edit lands on a branch, a human merges it.
      - name: Check tracked records against the catalog's own retirements
        working-directory: pipeline
        run: uv run scorecard supersessions --apply --out ../docs/feed-supersessions.md

      # Report-only: orphaned artifact directories (agency removed from the
      # registry, pages still live). Deletion stays a curator decision per
      # docs/listing-policy.md; this keeps the drift visible weekly.
      - name: Report orphaned artifact directories
        working-directory: pipeline
        run: |
          {
            echo "## Orphaned artifact directories"
            echo ""
            uv run scorecard prune
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the discovery report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: feed-discovery-report
          path: |
            docs/feed-discovery.md
            docs/feed-supersessions.md
          retention-days: 30

      # Both reports' run date changes every week; only a real registry edit is
      # worth a pull request. Discard a report-only diff so the job stays quiet
      # on weeks with nothing to do.
      - name: Keep the refreshed reports only when the registry changed
        id: changes
        run: |
          if git diff --quiet -- registry/; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
            git checkout -- docs/feed-discovery.md docs/feed-supersessions.md
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a pull request for the moved feeds
        if: steps.changes.outputs.moved == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # The default GITHUB_TOKEN can only open a pull request when the repo
          # has "Allow GitHub Actions to create and approve pull requests"
          # enabled; without it the API returns "GitHub Actions is not permitted
          # to create or approve pull requests". Set the DISCOVERY_PR_TOKEN
          # secret (a fine-grained PAT or GitHub App token with pull-requests:
          # write and contents: write) to open the PR as that identity instead.
          token: ${{ secrets.DISCOVERY_PR_TOKEN || github.token }}
          branch: chore/feed-discovery
          title: "chore(data): follow Mobility Database feed moves and retirements"
          commit-message: "chore(data): follow Mobility Database feed moves and retirements"
          body: |
            The weekly check against the Mobility Database found either a tracked
            feed whose canonical download URL has moved (`static_gtfs_url` updated
            to match) or a tracked feed record the catalog has retired in favour of
            another (`alias_of` and `feed_status` recorded, so the retired record
            stops publishing a second current grade beside its successor). Review
            each change against the catalog before merging; the full reports are
            regenerated in `docs/feed-discovery.md` and `docs/feed-supersessions.md`.
          labels: data, automated
          add-paths: |
            registry/
            docs/feed-discovery.md
            docs/feed-supersessions.md

      # The action pushes the branch before it calls the pull request API, so a
      # permissions failure leaves the registry edits on the branch with no
      # pointer to them. Say where they are.
      - name: Point at the branch when the pull request could not be opened
        if: failure() && steps.changes.outputs.moved == 'true'
        env:
          COMPARE_URL: ${{ github.server_url }}/${{ github.repository }}/compare/main...chore/feed-discovery?expand=1
        run: |
          {
            echo "## Feed moves are waiting on a pull request"
            echo ""
            echo "The registry edits are on the \`chore/feed-discovery\` branch."
            echo "Open the review pull request by hand: $COMPARE_URL"
          } >> "$GITHUB_STEP_SUMMARY"

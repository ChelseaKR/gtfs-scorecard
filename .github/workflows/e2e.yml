name: E2E

# Behavioral browser tests over the statically served site (pipeline/tests/e2e):
# hash-route smoke tests, the artifact-fetch failure path, keyboard-only flows,
# and SPA/prerendered parity. A separate workflow so ci.yml's merge gate stays
# fast and browser-free; the unit run deselects these via -m "not e2e"
# (pipeline/pyproject.toml [tool.pytest.ini_options]).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref (new push to a PR) to save minutes.
concurrency:
  # `github.ref` is `refs/pull/N/merge` on a pull request, so grouping by it cancels
  # superseded runs of the SAME pull request. That is the intent, and the saving, and it
  # is kept.
  #
  # On a push it is `refs/heads/main` for EVERY commit, so consecutive pushes to main
  # shared one group and the second cancelled the first outright. Flipping
  # `cancel-in-progress` to false does not fix it either: a queued run is then evicted
  # from the pending slot by the next arrival. Both roads end with a commit on main whose
  # only check-run is `cancelled`, and a cancelled run is no signal at all — not a pass,
  # not a failure, and easy to misread as either. Two commits lost their verdict this way
  # on 2026-09-06.
  #
  # So a push is grouped by its own SHA and cancels nothing: one commit, one verdict.
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      # The e2e dependency group brings pytest-playwright on top of dev.
      - run: uv sync --locked --group e2e
      - name: Install the Playwright chromium
        run: uv run playwright install --with-deps chromium
      # Render before testing, the way a11y.yml and pages.yml do. web/agency/**
      # is generated output that happens to be committed, and the daily scoring
      # run refreshes data/artifacts without regenerating it, so the checked-in
      # pages drift behind the data they were rendered from. Serving them
      # unrendered meant these tests asserted against a month-old build: ABQ RIDE
      # read D/61.5 in committed HTML while its artifact said F/48.1, and the
      # test that compared the two was right to fail. Deploy regenerates, so this
      # makes the suite exercise what production actually serves.
      - name: Materialize validated current dated records
        run: >-
          uv run python scripts/materialize_current_artifacts.py
          --artifacts-root ../data/artifacts
      - name: Render the static site
        run: uv run scorecard render-site
      # The explicit -m e2e overrides the default deselection in addopts.
      - run: uv run pytest tests/e2e -m e2e

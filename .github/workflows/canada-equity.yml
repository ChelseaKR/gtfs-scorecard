name: Canada equity (CIMD)

# Refresh the Canada served-area equity overlay from the Statistics Canada
# Canadian Index of Multiple Deprivation (ADR 0027). The CIMD is a static 2021
# index, so this runs monthly (and on demand): for each Canadian agency it reads
# the stops from the committed geometry artifact, queries the StatCan CIMD ESRI
# REST service for the dissemination areas the feed serves, and computes a
# within-Canada served-area need tier. No API key is needed. The territories are
# excluded from the CIMD, so a feed there (e.g. Yukon) reads as no-coverage. The
# agency pages and /api/v1/canada-equity.json read the committed result.

on:
  schedule:
    - cron: "43 7 1 * *" # first of the month, early UTC
  workflow_dispatch:

permissions:
  contents: read # the deploy key does the writing, not the workflow token

concurrency:
  group: canada-equity
  cancel-in-progress: false

jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Publish over the write-scoped deploy key, the same path the realtime
          # monitor uses. The main-branch ruleset requires a reviewed pull
          # request and lists deploy keys as its bypass actor, so a push made
          # with the default GITHUB_TOKEN is rejected with GH013.
          ssh-key: ${{ secrets.SCHEDULED_WRITER_SSH_KEY }}
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          python-version: "3.12"
      - name: Compute the Canada CIMD overlay
        working-directory: pipeline
        run: uv run scorecard canada-equity
      - name: Commit the overlay
        run: |
          git config user.name "scorecard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/artifacts/canada-equity.json || true
          if git diff --cached --quiet; then
            echo "No overlay change."
          else
            git commit -m "chore(equity): refresh Canada CIMD overlay"
            pushed=false
            for _attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then pushed=true; break; fi
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              sleep 3
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not push the refreshed Canada overlay after 5 attempts."
              exit 1
            fi
          fi

name: Realtime monitor

# Longitudinal GTFS-Realtime health (docs/expansion.md Phase B, ADR 0012). On a
# cron, take a short sampling burst of every agency's realtime feeds and append
# one uptime/freshness observation per agency to data/rt-health. The daily and
# intraday renders read that record and show realtime reliability on each page.
#
# This is the serverless tier: a cron cannot poll on the spec's 30-60s cadence,
# so each run samples a small burst and the record accumulates coverage across
# runs. Escalation to a continuous worker fleet is documented, not built.

on:
  schedule:
    - cron: "17 */3 * * *" # every three hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rt-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # RELIABILITY: this bound has to sit above the job's real runtime and below
    # the cron interval, and it was set to 45 without either being measured.
    # Every recorded successful run of this workflow took longer than that: the
    # burst walks every configured realtime endpoint one at a time, so the run
    # grows with the registry. Measured from the run history on 2026-09-08 —
    # ~117 min (2026-08-30/31), ~141-153 min (2026-09-01..04), 160-163 min
    # (2026-09-05). So from the moment the 45-minute bound landed, every
    # scheduled run was killed part-way through "Sample realtime feeds",
    # "Commit observations" was skipped, and no observation was recorded:
    # data/rt-health's newest commit is 2026-09-05 and the eleven runs since
    # are 11 of 11 `cancelled`, which is how GitHub records a job timeout and
    # is exactly the conclusion a sweep reads as "no signal".
    #
    # 170 sits above every observed run and below the 180-minute cron interval.
    # That interval is the real ceiling, not a comfort margin: the concurrency
    # group below is serial with `cancel-in-progress: false`, so a run that
    # outlives its own cadence makes the next one queue behind it, and a third
    # arrival evicts the queued one. A run that has taken longer than 170
    # minutes has already lost the schedule and should be stopped.
    #
    # The trend is not flat, so this bound is a repair and not a resting
    # place: 117 to 163 minutes in six days, on a 180-minute cadence. Raising
    # it past 180 is not the answer, because that is the cadence itself;
    # sharding the burst or lengthening the cron is, and which one is an
    # owner decision.
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # A write-scoped deploy key is the ruleset bypass actor for this
          # scheduled data publisher. The default token cannot bypass the
          # pull-request requirement on main.
          ssh-key: ${{ secrets.SCHEDULED_WRITER_SSH_KEY }}
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sample realtime feeds
        working-directory: pipeline
        run: uv run scorecard rt-health
      - name: Commit observations
        run: |
          git config user.name "scorecard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rt-health
          if git diff --cached --quiet; then
            echo "No realtime observations this run."
          else
            git commit -m "chore(rt): realtime health observations"
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then pushed=true; break; fi
              echo "push rejected (main moved); rebasing and retrying ($attempt)"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              sleep 3
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not push realtime observations after 5 attempts."
              exit 1
            fi
          fi

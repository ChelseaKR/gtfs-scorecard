name: Realtime monitor

# Longitudinal GTFS-Realtime health (docs/expansion.md Phase B, ADR 0012). On a
# cron, take a short sampling burst of every agency's realtime feeds and append
# one uptime/freshness observation per agency to data/rt-health. The daily and
# intraday renders read that record and show realtime reliability on each page.
#
# This is the serverless tier: a cron cannot poll on the spec's 30-60s cadence,
# so each run samples a small burst and the record accumulates coverage across
# runs. Escalation to a continuous worker fleet is documented, not built.

on:
  schedule:
    - cron: "17 */3 * * *" # every three hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rt-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # A write-scoped deploy key is the ruleset bypass actor for this
          # scheduled data publisher. The default token cannot bypass the
          # pull-request requirement on main.
          ssh-key: ${{ secrets.SCHEDULED_WRITER_SSH_KEY }}
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sample realtime feeds
        working-directory: pipeline
        run: uv run scorecard rt-health
      - name: Commit observations
        run: |
          git config user.name "scorecard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rt-health
          if git diff --cached --quiet; then
            echo "No realtime observations this run."
          else
            git commit -m "chore(rt): realtime health observations"
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then pushed=true; break; fi
              echo "push rejected (main moved); rebasing and retrying ($attempt)"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              sleep 3
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not push realtime observations after 5 attempts."
              exit 1
            fi
          fi

name: Standards pin

# DOC-01/DOC-03: the vendored standards were verified byte-for-byte against
# ChelseaKR/portfolio-standards v1.0.1 on 2026-07-10. The reviewed manifest
# makes that proof self-contained and merge-blocking without a cross-repository
# PAT. Renovate must update the pin, files, and manifest in one reviewed change.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  standards-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Verify pinned version and vendored bytes
        run: |
          set -euo pipefail
          configured=$(sed -n 's/^standards_version=//p' docs/standards/.standards-version)
          manifested=$(sed -n 's/^# standards_version=//p' docs/standards/.standards-manifest.sha256)
          if [ "$configured" != "$manifested" ]; then
            echo "::error::standards pin $configured does not match manifest $manifested"
            exit 1
          fi
          sed '/^#/d; /^$/d' docs/standards/.standards-manifest.sha256 | sha256sum -c -

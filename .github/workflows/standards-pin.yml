name: Standards pin

# DOC-01/DOC-03: the vendored standards were verified byte-for-byte against
# ChelseaKR/portfolio-standards v2.0.0 on 2026-08-09. The reviewed manifest
# makes that proof self-contained and merge-blocking without a cross-repository
# PAT. Renovate must update the pin, files, and manifest in one reviewed change.
#
# Scope, so this job is not mistaken for more than it is: it proves the
# vendored bytes match the pinned tag. It does not run the conformance
# checker, so no control gate in the standards is enforced here. The
# applicability declaration and the open gaps against v2.0.0 live in
# docs/standards-conformance-gaps.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref (new push to a PR) to save minutes.
concurrency:
  group: standards-pin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Verify pinned version and vendored bytes
        run: |
          set -euo pipefail
          configured=$(sed -n 's/^standards_version=//p' docs/standards/.standards-version)
          manifested=$(sed -n 's/^# standards_version=//p' docs/standards/.standards-manifest.sha256)
          if [ "$configured" != "$manifested" ]; then
            echo "::error::standards pin $configured does not match manifest $manifested"
            exit 1
          fi
          sed '/^#/d; /^$/d' docs/standards/.standards-manifest.sha256 | sha256sum -c -

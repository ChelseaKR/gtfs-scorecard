# SEC-08 / CICD-20: CodeQL SAST over the Python pipeline and the GitHub
# Actions workflows themselves (the `actions` CodeQL pack covers injection via
# untrusted expression contexts, exactly the class of issue `onboard.yml`'s
# issue-body parsing needs watching).
#
# This header used to read "both languages this repo actually has attack
# surface in". That was wrong: web/src/ is ~6,600 lines of hand-written
# browser JavaScript, including 24 innerHTML assignment sites in app.js, and
# it is the code a transit rider actually loads. Adding `javascript` to the
# matrix below is the open item from issue #288. It is not done here because
# it cannot be validated without running CodeQL, and a `javascript` row lands
# a new required status check ("Analyze (javascript)", see ADR 0033 and
# tests/test_required_status_checks.py) that would gate every merge on a
# result nobody has seen yet. Semgrep and gitleaks now cover web/src/ instead
# (.semgrepignore, .gitleaks.toml, both verified clean over the whole tree),
# so the directory is no longer unscanned by everything.
name: CodeQL

on:
  # CICD §11e: PRs into main + the weekly schedule. The former push: main
  # trigger re-analyzed a commit the merged PR run had already covered; the
  # schedule keeps the default-branch code-scanning baseline fresh.
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 3" # weekly, Wednesday — CodeQL's own analysis is slow-moving

permissions:
  contents: read

# Cancel superseded runs on the same ref (new push to a PR) to save minutes.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        if: matrix.language == 'python'
        uses: github/codeql-action/autobuild@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: "/language:${{ matrix.language }}"

# Feed records the 2026-07-11 registry dedupe (#69) removed as duplicates.
#
# Each removed id published a scorecard page until that day. It duplicated the
# kept record's feed URL apart from the URL scheme (an http/https twin of the
# same feed), so the kept record is its successor. Search engines had indexed
# many of these pages and still send readers to them; without this file they
# answer 404. render_site writes a redirect page for each one to the kept
# record's current scorecard (following any later retained alias), and lists
# it in _meta/retained-agency-redirects.json. A removed id that is a registry
# record again, or whose successor is no longer published, gets no redirect.
#
# Derived mechanically: every id in agencies.yaml before b07716c4a9c and not
# after it whose static_gtfs_url, ignoring the scheme and a trailing slash,
# matches exactly one record kept by that commit. Records the dedupe removed
# for other reasons (dead or keyed URLs) are not listed: they have no
# evidence-backed successor.

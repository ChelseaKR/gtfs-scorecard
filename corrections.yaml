# Published grades this project has withdrawn, and why.
#
# Every entry names one scorecard that was published about a named transit
# agency and should not have been. The grade was computed from an archive whose
# stops and trips were never read, so the two categories that read the feed both
# printed 0.0 for a measurement nobody made, and the letter beside them was an F
# nobody had earned. The scorer stopped producing these on 2026-09-01
# (score.UnreadableFeedError). It could not take back the ones already out.
#
# Each entry records:
#   agency_id        the published record
#   agency_name      the agency as the scorecard named it
#   snapshot_date    the snapshot the withdrawn grade was computed from
#   feed_sha256      the exact feed bytes it was computed from
#   grade, score     what was published
#   published_from   the first day this project published a grade of this kind
#                    for this record
#   published_until  the day it came down
#   cause            why the grade was wrong, verified for this feed
#   outcome          what stands in its place
#   evidence         what the cause rests on, in the reviewer's words
#
# The cause is verified per feed, not assumed. Eleven of the nineteen carry the
# validator's own `invalid_input_files_in_subfolder` notice in the published
# artifact: the archive wraps its tables in a folder, the reader looked at the
# top level, and found nothing. The other eight carry no such notice and are
# archives that really do describe no service; where the feed is still
# reachable, that was confirmed by reading it.
#
# Neither outcome is a number. A grade withdrawn because nothing was read cannot
# be corrected to a different reading of the same nothing. When a run does read
# one of these feeds, it publishes its own measurement and supersedes the
# withdrawal; until then the honest answer is that it is not measured.
#
# corrections.py enforces every direction: an entry with no artifact directory
# is stale and fails the build, an entry whose grade is still published has not
# taken effect and fails it, and a published latest.json that grades a feed with
# no stops and no trips and appears nowhere in this file fails it too. The last
# one is why `not_yet_corrected` exists at the bottom: a grade held back for a
# reason is still accounted for, and holding one back silently is not an option
# the check leaves open.


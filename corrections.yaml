# Published grades known to carry the same defect and not withdrawn in this
# change. Named here rather than left out of the check: a gate that is satisfied
# by narrowing what it looks at is not a gate. This list may only shrink.
not_yet_corrected:
  - agency_id: anaheim-resort-transportation-art
    reason: >-
      Published F (42.6) over an archive with no stops and no trips, so it is
      the same defect. It is held back because the correction is not the same
      one: rider experience scored 7.5 rather than 0.0, so the withdrawal
      wording and the outcome need their own review, and the source URL returns
      404 as of 2026-09-05 so the archive could not be re-read to establish the
      cause. Withdrawing it on a guess would replace one unverified claim with
      another.
  - agency_id: anaheim-resort-transportation-art-100
    reason: >-
      The same feed as anaheim-resort-transportation-art under a
      catalog-derived id, held back for the same reason.
  - agency_id: boxcar
    reason: >-
      Published C (73.0), not an F, over an archive whose stops.txt, routes.txt
      and trips.txt each hold a header row and nothing else. Confirmed live on
      2026-09-05. This one needs a scoring decision before a correction, not
      after: its calendar.txt has 89 real rows and its feed_info.txt a real
      validity window, so freshness is a genuine measurement and
      `score_feed_content` does not refuse the feed. Withdrawing the C without
      that decision would let the next run publish an A for a feed with no
      stops, no routes and no trips, which is worse than the C standing.

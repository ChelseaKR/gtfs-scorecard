# Countries and first-level subdivisions supported by the agency registry.
#
# Country keys are ISO 3166-1 alpha-2 codes. Subdivision keys are ISO 3166-2
# codes and must use the parent country as their prefix. The names are the
# canonical practitioner-facing labels published in the directory and API.


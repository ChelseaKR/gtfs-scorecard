<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og.png (social share card, site root). Rasterize with:
       rsvg-convert web/og.svg -o web/og.png
       Type: Helvetica-first stack so local rasterization matches the site's
       signage voice (the site itself uses Overpass, FHWA Highway Gothic).
       Carries the mark (web/favicon.svg's route-line-into-a-checkmark, see
       that file's comment) as a proper logo lockup next to the wordmark, so
       the favicon, the header, and this share card read as one identity. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#143123"/>
      <stop offset="1" stop-color="#0e2419"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- guide-sign border: a white keyline set just inside the panel edge -->
  <rect x="40" y="40" width="1120" height="550" rx="26" fill="none"
        stroke="#f2f3ee" stroke-width="4" opacity="0.9"/>

  <!-- mark + wordmark lockup -->
  <g transform="translate(92,84)">
    <circle cx="46" cy="46" r="46" fill="#163a2c" stroke="#f2f3ee" stroke-width="2.5" opacity="0.98"/>
    <path d="M23 47 L41 65 L74 26" fill="none" stroke="#fdc70a" stroke-width="10.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="23" cy="47" r="6" fill="#fdc70a"/>
    <circle cx="74" cy="26" r="9.2" fill="#f2f3ee" stroke="#fdc70a" stroke-width="6.2"/>
  </g>
  <text x="212" y="146" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="900" font-size="72" fill="#f2f3ee" letter-spacing="-1">GTFS Scorecard</text>

  <!-- title -->
  <text x="92" y="320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="900" font-size="86" fill="#f2f3ee" letter-spacing="-1.5">Free GTFS quality</text>
  <text x="92" y="404" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="900" font-size="86" fill="#f2f3ee" letter-spacing="-1.5">scorecards</text>

  <!-- subtitle -->
  <text x="94" y="452" font-family="'Public Sans', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="32" fill="#cdddcf">Plain-language grades and fixes for small transit agencies</text>

  <!-- split-flap grade tiles -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900"
     font-size="54" text-anchor="middle">
    <g>
      <rect x="92"  y="478" width="84" height="96" rx="9" fill="#1b3a2a"/>
      <text x="134" y="546" fill="#9fb2a2">F</text>
    </g>
    <g>
      <rect x="190" y="478" width="84" height="96" rx="9" fill="#1b3a2a"/>
      <text x="232" y="546" fill="#9fb2a2">D</text>
    </g>
    <g>
      <rect x="288" y="478" width="84" height="96" rx="9" fill="#1b3a2a"/>
      <text x="330" y="546" fill="#9fb2a2">C</text>
    </g>
    <g>
      <rect x="386" y="478" width="84" height="96" rx="9" fill="#1b3a2a"/>
      <text x="428" y="546" fill="#9fb2a2">B</text>
    </g>
    <!-- highlighted grade -->
    <g>
      <rect x="484" y="478" width="84" height="96" rx="9" fill="#fdc70a"/>
      <text x="526" y="546" fill="#102a20">A</text>
    </g>
  </g>

  <!-- footer right: domain + place -->
  <text x="1108" y="518" text-anchor="end"
        font-family="'Atkinson Hyperlegible Mono', ui-monospace, monospace"
        font-size="32" fill="#fdc70a">gtfsscorecard.org</text>
  <text x="1108" y="558" text-anchor="end"
        font-family="'Public Sans', 'Helvetica Neue', Arial, sans-serif"
        font-size="24" fill="#9fb2a2">Open source · Yolo County, CA</text>
</svg>

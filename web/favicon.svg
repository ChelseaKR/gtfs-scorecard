<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- GTFS Scorecard mark: a route line with two stops (the site's own
       transit-route-with-stop-dots motif, see web/og.svg and .report-route
       in web/src/styles.css) bent into a checkmark, on the site's darkest
       pine ground. The terminal stop is drawn larger and ringed, like a
       reached/scored destination. Palette is the real board/amber/paper
       tokens (web/src/styles.css), not new colors.
       Rasterize with:
         rsvg-convert -w 32 -h 32 web/favicon.svg -o web/favicon-32.png
         rsvg-convert -w 16 -h 16 web/favicon.svg -o web/favicon-16.png
         convert web/favicon-16.png web/favicon-32.png web/favicon.ico -->
  <circle cx="16" cy="16" r="16" fill="#102a20"/>
  <circle cx="16" cy="16" r="15.1" fill="none" stroke="#f2f3ee" stroke-width="0.9" opacity="0.55"/>
  <path d="M8 16 L14 22 L25 9" fill="none" stroke="#fdc70a" stroke-width="3.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="8" cy="16" r="2.1" fill="#fdc70a"/>
  <circle cx="25" cy="9" r="3.2" fill="#f2f3ee" stroke="#fdc70a" stroke-width="2.2"/>
</svg>

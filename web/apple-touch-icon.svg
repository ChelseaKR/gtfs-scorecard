<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Full-bleed square variant of web/favicon.svg for iOS home-screen icons:
       Apple composites transparent pixels as opaque black and applies its own
       corner mask, so this fills the canvas edge-to-edge instead of using the
       favicon's circular cutout.
       Rasterize with:
         rsvg-convert -w 180 -h 180 web/apple-touch-icon.svg -o web/apple-touch-icon.png -->
  <rect width="180" height="180" fill="#102a20"/>
  <g transform="scale(5.625)">
    <path d="M8 16 L14 22 L25 9" fill="none" stroke="#fdc70a" stroke-width="3.6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="8" cy="16" r="2.1" fill="#fdc70a"/>
    <circle cx="25" cy="9" r="3.2" fill="#f2f3ee" stroke="#fdc70a" stroke-width="2.2"/>
  </g>
</svg>

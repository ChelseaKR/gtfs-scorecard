# Oslo (NO) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
agencies:
  - id: ruter-oslo
    name: Ruter
    country: "NO"
    subdivision_code: NO-03
    subdivision_name: Oslo
    is_official: true
    static_gtfs_url: https://storage.googleapis.com/marduk-production/outbound/gtfs/rb_rut-aggregated-gtfs.zip
    license_note: >-
      Norwegian Licence for Open Government Data (NLOD) 2.0; free reuse
      including commercial use and adaptation with attribution. Published
      through Entur's national public transport data platform.
    operating_note: >-
      One of Entur's per-operator GTFS exports, covering Ruter in
      Oslo. The Entur national aggregate is a separate, much larger
      download that exceeds the standard archive cap; this per-operator slice
      stays within it.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://developer.entur.org/stops-and-timetable-data/
      terms_url: https://data.norge.no/nlod/en/2.0
      scope: [gtfs_schedule]
      attribution: >-
        Ruter; published through Entur under NLOD 2.0.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-18"
      identity_reviewed: true
  - id: bygdoyfergen-oslo
    name: Bygdøyfergen
    country: "NO"
    subdivision_code: NO-03
    subdivision_name: Oslo
    is_official: true
    static_gtfs_url: https://storage.googleapis.com/marduk-production/outbound/gtfs/rb_nyc-aggregated-gtfs.zip
    license_note: >-
      Norwegian Licence for Open Government Data (NLOD) 2.0; free reuse
      including commercial use and adaptation with attribution. Published
      through Entur's national public transport data platform.
    operating_note: >-
      One of Entur's per-operator GTFS exports, covering the passenger ferry
      between Oslo City Hall pier and Bygdøy. The service runs in the warmer
      half of the year, so the calendar covers a season rather than a year.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://developer.entur.org/stops-and-timetable-data/
      terms_url: https://data.norge.no/nlod/en/2.0
      scope: [gtfs_schedule]
      attribution: >-
        Bygdøyfergene (NYC AS); published through Entur under NLOD 2.0.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-09-01"
      identity_reviewed: true

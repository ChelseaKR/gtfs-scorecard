# Norway (NO) national operators — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
#
# These are national rail and express-coach operators whose per-operator GTFS
# exports Entur publishes separately from the county-authority feeds in the
# registry/no/<fylke>.yaml shards. They are national in scope, so they carry no
# subdivision. Each is one Entur per-operator export under NLOD 2.0; the Entur
# national aggregate is a separate, much larger download that exceeds the
# standard archive cap.
agencies:
  - id: vy-rail
    name: Vy (national rail)
    country: "NO"
    is_official: true
    static_gtfs_url: https://storage.googleapis.com/marduk-production/outbound/gtfs/rb_vyg-aggregated-gtfs.zip
    license_note: >-
      Norwegian Licence for Open Government Data (NLOD) 2.0; free reuse
      including commercial use and adaptation with attribution. Published
      through Entur's national public transport data platform.
    operating_note: >-
      One of Entur's per-operator GTFS exports, covering the Vy passenger rail
      network. Distinct from the county-authority local feeds and from the
      Entur national aggregate, which exceeds the standard archive cap.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://developer.entur.org/stops-and-timetable-data/
      terms_url: https://data.norge.no/nlod/en/2.0
      scope: [gtfs_schedule]
      attribution: >-
        Vy; published through Entur under NLOD 2.0.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-18"
      identity_reviewed: true

# Alaska (US) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
agencies:
  - id: anchorage-people-mover
    name: Anchorage People Mover
    subdivision_code: US-AK
    subdivision_name: Alaska
    static_gtfs_url: http://gtfs.muni.org/People_Mover.gtfs.zip
    mdb_id: 225

    state: Alaska
    name: Anchorage People Mover
    static_gtfs_url: http://gtfs.muni.org/People_Mover.gtfs.zip
    mdb_id: 225
    rt_urls:
      vehicle_positions: http://gtfs-rt.codeforanchorage.org/people_mover.pb
    license_note: No stated data license in the Mobility Database; verify before publishing.


# California (US) agencies — one curated shard of the registry (FIX-12).
#
# The field reference lives at the top of agencies.yaml, and
# docs/add-your-agency.md explains how to add an agency (new entries land in
# agencies.yaml first; a curator moves them here once located). Every shard
# is merged with agencies.yaml at load time, and ids must be unique across
# all of them.
agencies:
  - id: unitrans
    state: California
    name: Unitrans (ASUCD / City of Davis)
    static_gtfs_url: https://unitrans.ucdavis.edu/media/gtfs/Unitrans_GTFS.zip
    ntd_id: "90142"
    license_note: No stated data license (UC Regents copyright); see docs/feeds.md.
    # GTFS-RT exists via UmoIQ but requires an API key; see docs/feeds.md.
    rt_note: >-
      Unitrans runs live bus tracking, but its data feed needs an access key
      we don't have yet. Nothing here counts against the grade.


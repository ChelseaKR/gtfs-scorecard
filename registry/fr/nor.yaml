  # exercise local-language names, additional ISO subdivisions, combined and
  # single-kind realtime, and a multi-operator schedule. Sources and reuse
  # terms were verified 2026-07-12 and are recorded in docs/feeds.md.
  - id: lbus-bernay
    name: Réseau urbain l'Bus (Bernay)
    country: FR
    subdivision_code: FR-NOR
    subdivision_name: Normandie
    is_official: true
    static_gtfs_url: https://www.data.gouv.fr/api/1/datasets/r/9ffc26b2-d293-4ec5-9cf6-4690d542f019
    license_note: >-
      Licence Ouverte 2.0; published by Intercom Bernay Terres de Normandie
      through France's National Access Point.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://transport.data.gouv.fr/datasets/reseau-transport-urbain-de-bernay
      terms_url: https://www.data.gouv.fr/pages/legal/licences/etalab-2.0
      scope: [gtfs_schedule]
      attribution: Intercom Bernay Terres de Normandie.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-16"
      identity_reviewed: true
    # The publisher exposes one combined GTFS-Realtime stream for all kinds.
    rt_urls:

# Rīga (LV) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
agencies:
  # Mobility Database mdb-884 is deprecated and redirects to mdb-3502. Checked
  # 2026-10-02 in the catalog CSV: both rows name provider Rīgas Satiksme with
  # the same Rīga bounding box, and mdb-3502 is active, marked official, and
  # sources the data.gov.lv dataset this record's reuse_evidence already cites.
  # A deprecated row no longer supplies a mirror (#492), so the old pin left
  # this record with no fallback; the 2026-10-02 run timed out connecting to
  # saraksti.rigassatiksme.lv and was scored from mdb-884's copy.
  - id: rigas-satiksme
    name: Rīgas satiksme
    country: LV
    subdivision_code: LV-RIX
    subdivision_name: Rīga
    mdb_id: "3502"
    is_official: true
    static_gtfs_url: https://saraksti.rigassatiksme.lv/gtfs.zip
    license_note: >-
      CC0 1.0 per the data.gov.lv "Rīgas satiksme public transport routes"
      dataset. The scored URL is the operator's stable production endpoint.
    operating_note: >-
      Bus, tram, and trolleybus network of Rīga, operated by the municipal
      company Rīgas satiksme.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://data.gov.lv/dati/eng/dataset/marsrutu-saraksti-rigas-satiksme-sabiedriskajam-transportam
      terms_url: https://data.gov.lv/dati/eng/dataset/marsrutu-saraksti-rigas-satiksme-sabiedriskajam-transportam
      scope: [gtfs_schedule]
      attribution: >-
        Source: Rīgas satiksme via data.gov.lv, released under CC0 1.0.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-18"
      identity_reviewed: true

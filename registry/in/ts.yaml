# Telangana (IN) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
agencies:
  - id: tgsrtc-hyderabad-bus
    name: TGSRTC — Greater Hyderabad bus
    country: IN
    subdivision_code: IN-TS
    subdivision_name: Telangāna
    mdb_id: "3361"
    is_official: true
    static_gtfs_url: https://data.opencity.in/dataset/88e2d145-7ec6-4666-88dd-6cf18b18312e/resource/1b0d18bb-b2fb-4a79-8ed0-1e071da5790c/download/telangana_opendata_gtfs_tgsrtc_08_february_2026.zip
    license_note: >-
      TGSRTC's open-data terms permit commercial and non-commercial reuse,
      adaptation, reproduction, storage, display, transmission, and
      redistribution with attribution.
    operating_note: >-
      The current archive is an OpenCity mirror of TGSRTC's official open data
      because the first-party page routes downloads through a registration
      form. The agency-produced Greater Hyderabad export counts as one feed
      record.
    reuse_evidence:
      decision: approved
      source_kind: provider
      provider_source_url: https://www.tgsrtc.telangana.gov.in/open-data
      terms_url: https://www.tgsrtc.telangana.gov.in/open-data
      scope: [gtfs_schedule]
      attribution: Contains data provided by TGSRTC.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-23"
      identity_reviewed: true
  - id: hmrl-hyderabad-metro
    name: Hyderabad Metro Rail
    country: IN
    subdivision_code: IN-TS
    subdivision_name: Telangāna
    mdb_id: "2457"
    is_official: true
    static_gtfs_url: https://data.opencity.in/dataset/4e72c202-4cdb-4437-a629-ffcbe9519f73/resource/5fa250e1-3104-4ca7-ad31-4fa3321f6255/download/telangana_opendata_gtfs_hmrl_03_july_2026.zip
    license_note: >-
      HMRL's open-data terms grant free, non-exclusive use, adaptation,
      reproduction, storage, display, transmission, and redistribution for
      commercial and non-commercial applications. Credit with "Contains data
      provided by Hyderabad Metro Rail Ltd."
    operating_note: >-
      The three-line Hyderabad metro (Red, Green, Blue), published through
      Open Data Telangana and named in feed_info.txt as such. The archive is
      an OpenCity copy of that export because HMRL's own open-data page
      routes the download through a Google Form, the same arrangement
      already recorded for the TGSRTC bus feed. A 2026-09-01 preflight found
      service dated from 2026-07-03 to 2030-01-01; the scorecard measures
      that distant horizon rather than reading it as proof of maintenance.
      Counted as one feed record and distinct from the TGSRTC bus network.
    reuse_evidence:
      decision: approved
      source_kind: provider
      provider_source_url: https://hmrl.co.in/open-data/
      terms_url: https://hmrl.co.in/open-data/
      scope: [gtfs_schedule]
      attribution: Contains data provided by Hyderabad Metro Rail Ltd.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-09-01"
      identity_reviewed: true

# Liguria (IT) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
agencies:
  - id: amt-genova
    name: AMT Genova
    country: IT
    subdivision_code: IT-42
    subdivision_name: Liguria
    mdb_id: "2610"
    is_official: true
    static_gtfs_url: http://opendatagoogletransit.comune.genova.it/downloads/google_transit.zip
    license_note: >-
      CC BY 4.0 through Genoa's municipal open data record; credit AMT Genova
      and the Comune di Genova. The municipally hosted archive is used because
      it is the resource the CC BY record names; the operator's own host
      publishes no license.
    operating_note: >-
      The plain-HTTP download host is deliberate; the HTTPS variant of the
      municipal archive is unreachable.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://dati.comune.genova.it/dataset/amt-trasporto-pubblico-nel-comune-di-genova
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: AMT Genova and Comune di Genova.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-17"
      identity_reviewed: true
  - id: trenitalia-liguria
    name: Trenitalia regional rail in Liguria
    country: IT
    subdivision_code: IT-42
    subdivision_name: Liguria
    is_official: true
    static_gtfs_url: https://srvcarto.regione.liguria.it/dtuff/download_statico/opendata/trasporti/GTFS/GTFS-IT-ITC3-TRENITALIA-20260614-20261212-pf.zip
    license_note: >-
      CC BY 4.0 through Regione Liguria's open data portal; credit Regione
      Liguria and Trenitalia.
    operating_note: >-
      Trenitalia's regional rail service in Liguria, one operator dataset of
      the region's planned-service publication. Regione Liguria names each
      archive after its validity window, so the download is version-pinned
      and a curator refreshes it when the region publishes the next period.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://dati.regione.liguria.it/dataset/ds-637
      terms_url: https://creativecommons.org/licenses/by/4.0/deed.it
      scope: [gtfs_schedule]
      attribution: Regione Liguria and Trenitalia.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-09-01"
      identity_reviewed: true

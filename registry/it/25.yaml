      reachability stays visible on the public status page.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://dati.comune.milano.it/dataset/ds929-orari-del-trasporto-pubblico-locale-nel-comune-di-milano-in-formato-gtfs

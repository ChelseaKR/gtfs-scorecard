# Lombardia (IT) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
agencies:
  - id: atm-milano
    name: ATM Milano (Comune di Milano)
    country: IT
    subdivision_code: IT-25
    subdivision_name: Lombardia
    mdb_id: "2666"

# Campania (IT) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
agencies:
  - id: anm-napoli
    name: Azienda Napoletana Mobilità (ANM)
    country: IT
    subdivision_code: IT-72
    subdivision_name: Campania
    mdb_id: "893"
    static_gtfs_url: http://www.anm.it/google/google-transit.zip
    license_note: >-
      CC BY 4.0 through Naples' municipal open data portal; credit Azienda
      Napoletana Mobilità and the Comune di Napoli.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://dati.comune.napoli.it/dataset/75007df9-fdb2-427c-ad81-d5e084946ebc
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: Azienda Napoletana Mobilità and Comune di Napoli.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-17"
      identity_reviewed: true
  - id: eav-campania
    name: EAV (Ente Autonomo Volturno)
    country: IT
    subdivision_code: IT-72
    subdivision_name: Campania
    is_official: true
    static_gtfs_url: https://www.wimob.it/cfile/download.php?file=google-transit.zip
    license_note: >-
      Italian Open Data Licence 2.0 through EAV's own open data page, which
      allows commercial reuse with attribution; credit EAV srl.
    operating_note: >-
      EAV runs the Circumvesuviana, Cumana and Circumflegrea railways and
      regional bus services in Campania, a different operator from ANM
      Napoli. One archive covers both the rail and the road divisions. The
      download host is the platform EAV's own open data page links to.
    reuse_evidence:
      decision: approved
      source_kind: provider
      provider_source_url: https://www.eavsrl.it/open-data/
      terms_url: https://www.dati.gov.it/iodl/2.0/
      scope: [gtfs_schedule]
      attribution: EAV srl (Ente Autonomo Volturno).
      reviewed_by: ChelseaKR
      reviewed_on: "2026-09-01"
      identity_reviewed: true

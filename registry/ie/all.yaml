      source_kind: official_portal
      provider_source_url: https://www.transportforireland.ie/transitData/PT_Data.html
      terms_url: https://www.transportforireland.ie/transitData/PT_Data.html
      scope: [gtfs_schedule]
      attribution: National Transport Authority (Transport for Ireland).

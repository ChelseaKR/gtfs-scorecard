# Ireland (IE) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
agencies:
  - id: bus-eireann
    name: Bus Éireann
    country: IE
    mdb_id: "2636"
    is_official: true
    static_gtfs_url: https://www.transportforireland.ie/transitData/Data/GTFS_Bus_Eireann.zip

      source_kind: official_portal
      provider_source_url: https://www.zditm.szczecin.pl/pl/zditm/dla-programistow
      terms_url: https://creativecommons.org/publicdomain/zero/1.0/
      scope: [gtfs_schedule]
      attribution: Zarząd Dróg i Transportu Miejskiego w Szczecinie.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-17"
      identity_reviewed: true

# Dolnośląskie (PL) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
agencies:
  - id: mpk-legnica
    name: MPK Legnica
    country: PL
    subdivision_code: PL-02
    subdivision_name: Dolnośląskie
    is_official: true
    static_gtfs_url: https://gtfs.legnica.eu/static/GTFS.zip

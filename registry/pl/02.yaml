      and the City of Legnica.
    operating_note: >-
      The Legnica municipal bus network, published from a stable first-party
      City of Legnica endpoint and refreshed on a rolling short horizon.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://dane.gov.pl/pl/dataset/dane-transportowe-w-standardzie-gtfs
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: >-
        Miejskie Przedsiębiorstwo Komunikacyjne sp. z o.o. w Legnicy (MPK
        Legnica); City of Legnica open data.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-18"
      identity_reviewed: true

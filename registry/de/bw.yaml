# Baden-Württemberg (DE) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
agencies:
  - id: bodo-verkehrsverbund
    name: bodo Verkehrsverbund (Bodensee-Oberschwaben)
    country: DE
    subdivision_code: DE-BW
    subdivision_name: Baden-Württemberg
    mdb_id: "769"
    is_official: true
    static_gtfs_url: https://www.nvbw.de/fileadmin/user_upload/service/open_data/fahrplandaten_mit_liniennetz/bodo.zip
    license_note: >-
      Datenlizenz Deutschland - Namensnennung 2.0 through NVBW's open data
      portal; mark reuse as a dataset of NVBW GmbH with a link back to the
      portal. Route shapes derive from OpenStreetMap and carry the
      OpenStreetMap contributors credit.
    operating_note: >-
      One association feed covering the bodo tariff area's operators; counted
      as one feed record, not a distinct-agency count.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://www.nvbw.de/open-data/fahrplandaten/fahrplandaten-mit-liniennetz
      terms_url: https://www.nvbw.de/open-data/lizenz
      scope: [gtfs_schedule]
      attribution: >-
        Datensatz der NVBW GmbH; route shapes include OpenStreetMap
        contributors.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-17"
      identity_reviewed: true

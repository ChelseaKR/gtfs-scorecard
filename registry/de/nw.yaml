# Nordrhein-Westfalen (DE) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
agencies:
  - id: vrs-rhein-sieg
    name: Verkehrsverbund Rhein-Sieg (VRS)
    country: DE
    subdivision_code: DE-NW
    subdivision_name: Nordrhein-Westfalen
    mdb_id: "778"
    is_official: false
    static_gtfs_url: https://download.vrs.de/gtfs/google_transit_goR.zip
    license_note: >-
      Datenlizenz Deutschland Zero 2.0 per the VRS open data page; attribution
      is not legally required, but GTFS Scorecard credits VRS GmbH as the
      source. The GTFS-SOLL download is open; VRS's OpenService interfaces and
      GTFS-RT need a signed usage agreement and login and stay unused here.
    operating_note: >-
      One association feed covering the VRS tariff area's operators in the
      Cologne/Bonn region, updated nightly; counted as one feed record, not a
      distinct-agency count.
    reuse_evidence:
      decision: approved
      source_kind: provider
      provider_source_url: https://www.vrs.de/fuer-unternehmen/open-data-service
      terms_url: https://www.govdata.de/dl-de/zero-2-0
      scope: [gtfs_schedule]
      attribution: Verkehrsverbund Rhein-Sieg GmbH (VRS).
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-17"
      identity_reviewed: true
  - id: avv-aachen
    name: Aachener Verkehrsverbund (AVV)
    country: DE
    subdivision_code: DE-NW
    subdivision_name: Nordrhein-Westfalen
    mdb_id: "1094"
    is_official: true
    static_gtfs_url: https://opendata.avv.de/current_GTFS/AVV_GTFS_mit_SPNV.zip
    license_note: >-
      CC0 for the schedule data per AVV's open data licence and readme;
      attribution is not legally required, but GTFS Scorecard credits AVV as the
      source. Route shapes derive from OpenStreetMap and carry the OpenStreetMap
      contributors credit under ODbL.
    operating_note: >-
      One association feed covering the AVV tariff area's operators around
      Aachen, including regional rail (SPNV); counted as one feed record, not a
      distinct-agency count.
    reuse_evidence:
      decision: approved
      source_kind: provider
      provider_source_url: https://opendata.avv.de/
      terms_url: https://creativecommons.org/publicdomain/zero/1.0/
      scope: [gtfs_schedule]
      attribution: >-
        Aachener Verkehrsverbund (AVV); route shapes include OpenStreetMap
        contributors.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-18"
      identity_reviewed: true

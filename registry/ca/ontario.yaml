    state: Ontario
    name: Barrie Transit (Ontario)
    country: CA
    mdb_id: 3
    static_gtfs_url: http://www.myridebarrie.ca/gtfs/Google_transit.zip
    license_note: No stated data license in the Mobility Database; verify before relying on.

  - id: london-transit-commission
    state: Ontario
    name: London Transit Commission (Ontario)
    country: CA
    mdb_id: 2
    static_gtfs_url: http://www.londontransit.ca/gtfsfeed/google_transit.zip
    license_note: No stated data license in the Mobility Database; verify before relying on.

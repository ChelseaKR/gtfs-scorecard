      including commercially, with attribution. Derived measurements by
      GTFS Scorecard.
    operating_note: >-
      The national intercity passenger rail network across Canada; a
      multi-province feed carried without a subdivision. Counted as one
      feed record.
    reuse_evidence:
      decision: approved
      source_kind: provider
      provider_source_url: https://www.viarail.ca/en/developer-resources
      terms_url: https://open.canada.ca/en/open-government-licence-canada
      scope: [gtfs_schedule]
      attribution: VIA Rail Canada.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-18"
      identity_reviewed: true

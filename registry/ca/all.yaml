# Canada nationwide (CA) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
agencies:
  - id: via-rail-canada
    name: VIA Rail Canada
    country: CA
    mdb_id: "735"
    is_official: true
    static_gtfs_url: https://www.viarail.ca/sites/all/files/gtfs/viarail.zip
    license_note: >-
      Open Government Licence – Canada version 2.0: a worldwide,

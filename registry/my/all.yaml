# Malaysia national (MY) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
agencies:
  - id: ktmb-national
    name: Keretapi Tanah Melayu (KTMB)
    country: MY
    is_official: true
    organization_id: ktmb
    static_gtfs_url: https://api.data.gov.my/gtfs-static/ktmb
    license_note: >-
      CC BY 4.0; published as open data through data.gov.my, the Government of
      Malaysia's official open data platform. Credit Keretapi Tanah Melayu
      Berhad (KTMB).
    operating_note: >-
      Malaysia's national railway: the KTM Komuter commuter lines and the
      intercity shuttle services across Peninsular Malaysia. Carried as a
      national feed with no single subdivision; counted as one feed record.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://developer.data.gov.my/realtime-api/gtfs-static
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: >-
        Keretapi Tanah Melayu Berhad (KTMB), published as open data through
        data.gov.my, the Government of Malaysia's official open data platform,
        under CC BY 4.0.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-18"
      identity_reviewed: true

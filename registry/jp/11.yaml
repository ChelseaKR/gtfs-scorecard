# Saitama (JP) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
#
# Curated from Japan's national GTFS Data Repository (gtfs-data.jp, operated by
# AIGID under the "standard bus information format"/GTFS-JP program). See
# docs/feeds.md, "Japan gtfs-data.jp wave". Each feed's open license, current
# calendar, and official municipal publisher were verified on 2026-07-18; none
# is carried by the Mobility Database.
agencies:
  - id: kumagaya-yuyu-bus
    name: Kumagaya City Yuyu Bus (熊谷市ゆうゆうバス)
    country: JP
    subdivision_code: JP-11
    subdivision_name: Saitama
    static_gtfs_url: https://api.gtfs-data.jp/v2/organizations/kumagayacity/feeds/yuuyuubus/files/feed.zip?rid=current
    license_note: >-
      CC BY 4.0; published as GTFS-JP open data by Kumagaya City through the
      GTFS Data Repository (gtfs-data.jp). Credit Kumagaya City.
    operating_note: >-
      Kumagaya City's community bus (ゆうゆうバス) in northern Saitama; counted as
      one feed record.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://gtfs-data.jp/feed/kumagayacity.yuuyuubus
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: >-
        Kumagaya City. Published as GTFS-JP open data through the GTFS Data
        Repository (gtfs-data.jp), operated by AIGID.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-18"
      identity_reviewed: true
  - id: wako-city-loop-bus
    name: Wako City Loop Bus Wakoba (和光市内循環バス「わこば」)
    country: JP
    subdivision_code: JP-11
    subdivision_name: Saitama
    static_gtfs_url: https://api.gtfs-data.jp/v2/organizations/wakocity/feeds/Wako-City-junkanbus/files/feed.zip?rid=current
    license_note: >-
      CC BY 4.0; published as GTFS-JP open data by Wako City through the
      GTFS Data Repository (gtfs-data.jp). Credit Wako City.
    operating_note: >-
      Wako City's Wakoba city loop bus (市内循環バス「わこば」); a second Saitama
      feed record distinct from Kumagaya City.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://gtfs-data.jp/feed/wakocity.Wako-City-junkanbus
      terms_url: https://creativecommons.org/licenses/by/4.0/

# Saga (JP) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
#
# Curated from Japan's national GTFS Data Repository (gtfs-data.jp, operated by
# AIGID) in the second gtfs-data.jp wave (docs/feeds.md). Each is an official
# municipal or first-party operator GTFS-JP feed, openly licensed and
# mechanically preflighted, and absent from the Mobility Database.
agencies:
  - id: imari-city-imarin-bus
    name: Imari City Imarin Bus (伊万里市いまりんバス)
    country: JP
    subdivision_code: JP-41
    subdivision_name: Saga
    static_gtfs_url: https://api.gtfs-data.jp/v2/organizations/imaricity/feeds/imarinbus/files/feed.zip?rid=current
    license_note: >-
      CC0 1.0 (public domain dedication); published as GTFS-JP open data
      by Imari City through the GTFS Data Repository (gtfs-data.jp).
    operating_note: >-
      Imari City's Imarin Bus network (いまりんバス: 市街地線・郊外線・地域線); counted as
      one feed record.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://gtfs-data.jp/feed/imaricity.imarinbus
      terms_url: https://creativecommons.org/publicdomain/zero/1.0/
      scope: [gtfs_schedule]
      attribution: >-
        Imari City. Published as GTFS-JP open data (CC0 1.0) through the
        GTFS Data Repository (gtfs-data.jp), operated by AIGID.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-18"
      identity_reviewed: true
  - id: saga-pref-route-bus
    name: Saga Prefecture Route Bus (佐賀県 路線バス)
    country: JP
    subdivision_code: JP-41
    subdivision_name: Saga
    is_official: true
    static_gtfs_url: http://opendata.sagabus.info/saga-current.zip
    rt_urls:
      trip_updates: http://opendata.sagabus.info/route.pb
      vehicle_positions: http://opendata.sagabus.info/vehicle.pb
      service_alerts: http://opendata.sagabus.info/alert.pb
    rt_note: >-
      All three realtime files return GTFS-RT protobuf. The site serves
      plain HTTP only; a request to port 443 is refused.
    license_note: >-
      CC BY 4.0 stated on the Saga bus open-data site, whose feed_info names
      Saga Prefecture as publisher. Credit Saga Prefecture.
    operating_note: >-
      One archive covering Saga City Transportation Bureau, Showa Jidosha,
      Yutoku Jidosha and Saga City. It does not repackage the separately
      listed Imari City feed.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: http://opendata.sagabus.info/
      terms_url: http://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: Saga Prefecture (佐賀県) and the publishing operators.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-09-01"
      identity_reviewed: true

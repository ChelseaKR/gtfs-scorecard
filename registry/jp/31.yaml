# JP agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
agencies:
  - id: nihon-kotsu-tottori
    name: Nihon Kotsu (日本交通)
    country: JP
    subdivision_code: JP-31
    subdivision_name: Tottori
    is_official: true
    static_gtfs_url: https://odp-pref-tottori.tori-info.co.jp/bus_data/1.zip
    license_note: >-
      CC BY 2.1 Japan through the Tottori Prefecture open-data portal.
      Credit Tottori Prefecture and Nihon Kotsu.
    operating_note: >-
      Nihon Kotsu's scheduled bus routes across Tottori Prefecture. The
      portal also publishes vehicle positions as JSON rather than protobuf,
      so no realtime endpoint is recorded here.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://odp-pref-tottori.tori-info.co.jp/bus.html
      terms_url: https://creativecommons.org/licenses/by/2.1/jp/
      scope: [gtfs_schedule]
      attribution: Nihon Kotsu, published by Tottori Prefecture.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-09-01"
      identity_reviewed: true

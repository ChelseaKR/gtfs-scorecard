# Niigata (JP) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
#
# Curated from Japan's national GTFS Data Repository (gtfs-data.jp, operated by
# AIGID under the "standard bus information format"/GTFS-JP program). See
# docs/feeds.md, "Japan gtfs-data.jp wave". Each feed's open license, current
# calendar, and official municipal publisher were verified on 2026-07-18; none
# is carried by the Mobility Database.
agencies:
  - id: tsubame-community-bus
    name: Tsubame City Community Bus (燕市コミュニティバス)
    country: JP
    subdivision_code: JP-15
    subdivision_name: Niigata
    static_gtfs_url: https://api.gtfs-data.jp/v2/organizations/tsubamecity/feeds/tsubame_bus/files/feed.zip?rid=current
    license_note: >-
      CC BY 4.0; published as GTFS-JP open data by Tsubame City through the
      GTFS Data Repository (gtfs-data.jp). Credit Tsubame City.
    operating_note: >-
      Tsubame City's community bus network in central Niigata; counted as one
      feed record.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://gtfs-data.jp/feed/tsubamecity.tsubame_bus
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: >-
        Tsubame City. Published as GTFS-JP open data through the GTFS Data
        Repository (gtfs-data.jp), operated by AIGID.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-18"
      identity_reviewed: true
  - id: kamo-city-kamon-bus
    name: Kamo City Kamon Bus (加茂市営バス「かもんバス」)
    country: JP
    subdivision_code: JP-15
    subdivision_name: Niigata
    static_gtfs_url: https://api.gtfs-data.jp/v2/organizations/kamocity/feeds/kamonbus/files/feed.zip?rid=current
    license_note: >-
      CC BY 4.0; published as GTFS-JP open data by Kamo City through the
      GTFS Data Repository (gtfs-data.jp). Credit Kamo City.
    operating_note: >-
      Kamo City's municipal Kamon Bus network; counted as one feed record.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://gtfs-data.jp/feed/kamocity.kamonbus
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: >-
        Kamo City. Published as GTFS-JP open data through the GTFS Data
        Repository (gtfs-data.jp), operated by AIGID.
      reviewed_by: ChelseaKR

# Iwate (JP) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
#
# Curated from Japan's national GTFS Data Repository (gtfs-data.jp, operated by
# AIGID under the "standard bus information format"/GTFS-JP program). See
# docs/feeds.md, "Japan gtfs-data.jp wave". Each feed's open license, current
# calendar, and official municipal publisher were verified on 2026-07-18; none
# is carried by the Mobility Database.
agencies:
  - id: hanamaki-community-bus
    name: Hanamaki City Community Bus (花巻市コミュニティバス)
    country: JP
    subdivision_code: JP-03
    subdivision_name: Iwate
    static_gtfs_url: https://api.gtfs-data.jp/v2/organizations/hanamakicity/feeds/hanamaki/files/feed.zip?rid=current
    license_note: >-
      CC BY 4.0; published as GTFS-JP open data by Hanamaki City through the
      GTFS Data Repository (gtfs-data.jp). Credit Hanamaki City.
    operating_note: >-
      Hanamaki City's community bus network in central Iwate; counted as one
      feed record.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://gtfs-data.jp/feed/hanamakicity.hanamaki
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: >-
        Hanamaki City. Published as GTFS-JP open data through the GTFS Data
        Repository (gtfs-data.jp), operated by AIGID.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-18"
      identity_reviewed: true

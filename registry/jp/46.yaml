# Kagoshima (JP) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
#
# Curated from Japan's national GTFS Data Repository (gtfs-data.jp, operated by
# AIGID) in the second gtfs-data.jp wave (docs/feeds.md). Each is an official
# municipal or first-party operator GTFS-JP feed, openly licensed and
# mechanically preflighted, and absent from the Mobility Database.
agencies:
  - id: kagoshima-city-ai-bus
    name: Kagoshima City Community Bus Ai Bus (鹿児島市コミュニティバス「あいばす」)
    country: JP
    subdivision_code: JP-46
    subdivision_name: Kagoshima
    static_gtfs_url: https://api.gtfs-data.jp/v2/organizations/kagoshimacity/feeds/aibus/files/feed.zip?rid=current
    license_note: >-
      CC BY 4.0; published as GTFS-JP open data by Kagoshima City
      through the GTFS Data Repository (gtfs-data.jp). Credit Kagoshima
      City.
    operating_note: >-
      Kagoshima City's Ai Bus community network (コミュニティバス「あいばす」);
      counted as one feed record.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://gtfs-data.jp/feed/kagoshimacity.aibus
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: >-
        Kagoshima City. Published as GTFS-JP open data through the GTFS
        Data Repository (gtfs-data.jp), operated by AIGID.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-18"
      identity_reviewed: true
  - id: sakurajima-ferry
    name: Sakurajima Ferry (鹿児島市船舶局 桜島フェリー)
    country: JP
    subdivision_code: JP-46
    subdivision_name: Kagoshima
    is_official: true
    static_gtfs_url: https://api-public.odpt.org/api/v4/files/odpt/KagoshimaCityMaritimeBureau/AllLines.zip?date=current
    license_note: >-
      CC BY 4.0; published by the Kagoshima City maritime bureau through the
      Public Transportation Open Data Center (ODPT). Credit Kagoshima City
      and ODPT.
    operating_note: >-
      The city-run Sakurajima ferry between Kagoshima Port and Sakurajima
      Port, published as a single ferry route.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://ckan.odpt.org/dataset/kagoshima_city_maritime_bureau_all_lines
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: >-
        Kagoshima City Maritime Bureau, published through the Public
        Transportation Open Data Center (ODPT).
      reviewed_by: ChelseaKR
      reviewed_on: "2026-09-01"
      identity_reviewed: true

    subdivision_code: JP-22
    subdivision_name: Shizuoka
    static_gtfs_url: https://api.gtfs-data.jp/v2/organizations/shimadacity/feeds/shimada_combus/files/feed.zip?rid=current
    license_note: >-
      CC BY 4.0; published as GTFS-JP open data by Shimada City through the
      GTFS Data Repository (gtfs-data.jp). Credit Shimada City.
    operating_note: >-
      Shimada City's community bus network in central Shizuoka; counted as one
      feed record.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://gtfs-data.jp/feed/shimadacity.shimada_combus
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: >-
        Shimada City. Published as GTFS-JP open data through the GTFS Data
        Repository (gtfs-data.jp), operated by AIGID.

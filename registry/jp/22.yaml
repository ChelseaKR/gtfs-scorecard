# Shizuoka (JP) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
#
# Curated from Japan's national GTFS Data Repository (gtfs-data.jp, operated by
# AIGID under the "standard bus information format"/GTFS-JP program). See
# docs/feeds.md, "Japan gtfs-data.jp wave". Each feed's open license, current
# calendar, and official municipal publisher were verified on 2026-07-18; none
# is carried by the Mobility Database.
agencies:
  - id: shimada-community-bus
    name: Shimada City Community Bus (島田市コミュニティバス)
    country: JP
    subdivision_code: JP-22
    subdivision_name: Shizuoka
    static_gtfs_url: https://api.gtfs-data.jp/v2/organizations/shimadacity/feeds/shimada_combus/files/feed.zip?rid=current
    license_note: >-
      CC BY 4.0; published as GTFS-JP open data by Shimada City through the
      GTFS Data Repository (gtfs-data.jp). Credit Shimada City.
    operating_note: >-
      Shimada City's community bus network in central Shizuoka; counted as one
      feed record.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://gtfs-data.jp/feed/shimadacity.shimada_combus
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: >-
        Shimada City. Published as GTFS-JP open data through the GTFS Data
        Repository (gtfs-data.jp), operated by AIGID.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-18"
      identity_reviewed: true
  - id: fujieda-city-bus
    name: Fujieda City Community Bus (藤枝市自主運行バス)
    country: JP
    subdivision_code: JP-22
    subdivision_name: Shizuoka
    static_gtfs_url: https://api.gtfs-data.jp/v2/organizations/fujiedacity/feeds/gtfsfjed/files/feed.zip?rid=current
    license_note: >-
      CC BY 4.0; published as GTFS-JP open data by Fujieda City through
      the GTFS Data Repository (gtfs-data.jp). Credit Fujieda City.
    operating_note: >-
      Fujieda City's self-operated community bus (自主運行バス: 駅南循環・アクセスバス);
      a second Shizuoka feed record distinct from Shimada City.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://gtfs-data.jp/feed/fujiedacity.gtfsfjed
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: >-
        Fujieda City. Published as GTFS-JP open data through the GTFS
        Data Repository (gtfs-data.jp), operated by AIGID.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-18"
      identity_reviewed: true

# Okinawa (JP) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
#
# Curated from Japan's national GTFS Data Repository (gtfs-data.jp, operated by
# AIGID) in the second gtfs-data.jp wave (docs/feeds.md). Each is an official
# municipal or first-party operator GTFS-JP feed, openly licensed and
# mechanically preflighted, and absent from the Mobility Database.
agencies:
  - id: yaese-town-bus
    name: Yaese Town Bus (八重瀬町バス)
    country: JP
    subdivision_code: JP-47
    subdivision_name: Okinawa
    static_gtfs_url: https://api.gtfs-data.jp/v2/organizations/yaesetown/feeds/yaese-town-bus/files/feed.zip?rid=current
    license_note: >-
      CC BY 4.0; published as GTFS-JP open data by Yaese Town through
      the GTFS Data Repository (gtfs-data.jp). Credit Yaese Town.
    operating_note: >-
      Yaese Town's community bus (registration-based service for
      eligible residents); counted as one feed record.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://gtfs-data.jp/feed/yaesetown.yaese-town-bus
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: >-
        Yaese Town. Published as GTFS-JP open data through the GTFS Data
        Repository (gtfs-data.jp), operated by AIGID.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-18"
      identity_reviewed: true

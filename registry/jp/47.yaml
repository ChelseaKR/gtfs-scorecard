    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://gtfs-data.jp/feed/yanbaru-expressbus.yanbaru-express-bus
      terms_url: https://creativecommons.org/licenses/by/4.0/

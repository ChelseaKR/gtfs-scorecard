    name: Anjo City Ankuru Bus (安城市あんくるバス)
    country: JP
    subdivision_code: JP-23
    subdivision_name: Aichi
    static_gtfs_url: https://api.gtfs-data.jp/v2/organizations/anjocity/feeds/AnkuruBus/files/feed.zip?rid=current
    license_note: >-
      CC BY 4.0; published as GTFS-JP open data by Anjo City through the GTFS
      Data Repository (gtfs-data.jp). Credit Anjo City.
    operating_note: >-
      Anjo City's community bus (あんくるバス) in Aichi; counted as one feed record.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://gtfs-data.jp/feed/anjocity.AnkuruBus
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: >-
        Anjo City. Published as GTFS-JP open data through the GTFS Data
        Repository (gtfs-data.jp), operated by AIGID.

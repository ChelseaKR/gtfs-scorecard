      CC BY 4.0; published as GTFS-JP open data by Tosaden Kotsu through
      the GTFS Data Repository (gtfs-data.jp). Credit Tosaden Kotsu.
    operating_note: >-
      Tosaden Kotsu's Kochi city streetcar / tram network (路面電車); a
      first-party operator feed counted as one feed record.
    reuse_evidence:
      decision: approved

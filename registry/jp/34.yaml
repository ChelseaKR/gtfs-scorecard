agencies:
  - id: hiroden-bus
    name: Hiroden Bus (広島電鉄バス)
    country: JP
    subdivision_code: JP-34
    subdivision_name: Hiroshima
    is_official: true
    static_gtfs_url: https://ajt-mobusta-gtfs.mcapps.jp/static/8/current_data.zip
    rt_urls:
      trip_updates: https://ajt-mobusta-gtfs.mcapps.jp/realtime/8/trip_updates.bin
      vehicle_positions: https://ajt-mobusta-gtfs.mcapps.jp/realtime/8/vehicle_position.bin
      service_alerts: https://ajt-mobusta-gtfs.mcapps.jp/realtime/8/alerts.bin
    license_note: >-
      CC0 public domain dedication, stated on the Hiroshima Bus Association
      GTFS open data site that publishes the feed. No attribution is
      required; the association asks readers to note that completeness is
      not guaranteed.
    operating_note: >-
      Hiroshima Electric Railway's bus network in and around Hiroshima City.
      The feed also carries Fuchu Town's contracted service. The portal
      publishes the current-data archive alongside a future-data archive for
      a pending timetable revision; this record scores the current data.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://www.bus-kyo.or.jp/gtfs-open-data
      terms_url: https://creativecommons.org/publicdomain/zero/1.0/
      scope: [gtfs_schedule]
      attribution: >-
        Hiroshima Electric Railway, published through the Hiroshima Bus
        Association GTFS open data site (CC0, no attribution required).
      reviewed_by: ChelseaKR
      reviewed_on: "2026-09-01"
      identity_reviewed: true

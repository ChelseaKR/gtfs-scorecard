# Tokushima (JP) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
#
# Discovered through the Transitland Atlas (docs/feeds.md, "Transitland-sourced
# wave"): an official municipal GTFS-JP feed published as open data through the
# GTFS Data Repository (gtfs-data.jp, operated by AIGID) and absent from the
# Mobility Database.
agencies:
  - id: naruto-city-ferry
    name: Naruto City Ferry (鳴門市営渡船)
    country: JP
    subdivision_code: JP-36
    subdivision_name: Tokushima
    static_gtfs_url: https://api.gtfs-data.jp/v2/organizations/narutocity/feeds/narutocitytosen/files/feed.zip?rid=current
    license_note: >-
      CC BY 4.0; published as GTFS-JP open data by Naruto City through the GTFS
      Data Repository (gtfs-data.jp). Credit Naruto City.
    operating_note: >-
      Naruto City's municipal ferry (市営渡船) service, scored on the same GTFS
      Schedule rubric as any fixed-route feed; counted as one feed record.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://gtfs-data.jp/feed/narutocity.narutocitytosen
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: >-
        Naruto City. Published as GTFS-JP open data through the GTFS Data
        Repository (gtfs-data.jp), operated by AIGID.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-18"
      identity_reviewed: true

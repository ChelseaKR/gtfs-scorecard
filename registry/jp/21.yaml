# Gifu (JP) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
#
# Discovered through the Transitland Atlas (docs/feeds.md, "Transitland-sourced
# wave"): an official municipal GTFS-JP feed published as open data through the
# GTFS Data Repository (gtfs-data.jp, operated by AIGID) and absent from the
# Mobility Database.
agencies:
  - id: toki-community-bus
    name: Toki City Community Bus (土岐市民バス)
    country: JP
    subdivision_code: JP-21
    subdivision_name: Gifu
    static_gtfs_url: https://api.gtfs-data.jp/v2/organizations/tokicity/feeds/communitybus/files/feed.zip?rid=current
    license_note: >-
      CC BY 4.0; published as GTFS-JP open data by Toki City through the GTFS
      Data Repository (gtfs-data.jp). Credit Toki City.
    operating_note: >-
      Toki City's community bus (市民バス) network; counted as one feed record.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://gtfs-data.jp/feed/tokicity.communitybus
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: >-
        Toki City. Published as GTFS-JP open data through the GTFS Data
        Repository (gtfs-data.jp), operated by AIGID.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-18"
      identity_reviewed: true

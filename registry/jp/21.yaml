      source_kind: official_portal
      provider_source_url: https://gtfs-data.jp/feed/gifucity.communitybus
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: >-
        Gifu City. Published as GTFS-JP open data through the GTFS Data

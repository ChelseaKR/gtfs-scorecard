    license_note: >-
      CC BY 4.0; published as GTFS-JP open data by Aridagawa Town
      through the GTFS Data Repository (gtfs-data.jp). Credit Aridagawa
      Town.
    operating_note: >-
      Aridagawa Town's community bus network; counted as one feed
      record.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://gtfs-data.jp/feed/aridagawatown.aridagawatownbus
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: >-
        Aridagawa Town. Published as GTFS-JP open data through the GTFS

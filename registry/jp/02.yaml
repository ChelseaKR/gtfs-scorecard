# Aomori (JP) agencies — one manifest-listed shard of the GTFS Scorecard registry.
#
# The field reference and contribution workflow live in registry/README.md.
# Every id must be unique across every shard listed by registry/index.yaml.
#
# Curated from Japan's national GTFS Data Repository (gtfs-data.jp, operated by
# AIGID under the "standard bus information format"/GTFS-JP program). See
# docs/feeds.md, "Japan gtfs-data.jp wave". Each feed's open license, current
# calendar, and official municipal publisher were verified on 2026-07-18; none
# is carried by the Mobility Database.
agencies:
  - id: hachinohe-city-bus
    name: Hachinohe City Bus (八戸市営バス)
    country: JP
    subdivision_code: JP-02
    subdivision_name: Aomori
    static_gtfs_url: https://api.gtfs-data.jp/v2/organizations/hachinohe/feeds/hachinohe-citybus/files/feed.zip?rid=current
    license_note: >-
      CC BY 4.0; published as GTFS-JP open data by the Hachinohe City
      Transportation Bureau through the GTFS Data Repository (gtfs-data.jp).
      Credit the Hachinohe City Transportation Bureau.
    operating_note: >-
      The Hachinohe City Transportation Bureau's municipal bus network in
      northeastern Aomori; counted as one feed record.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://gtfs-data.jp/feed/hachinohe.hachinohe-citybus
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: >-
        The Hachinohe City Transportation Bureau. Published as GTFS-JP open
        data through the GTFS Data Repository (gtfs-data.jp), operated by
        AIGID.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-18"
      identity_reviewed: true
  - id: misawa-city-me-bus
    name: Misawa City Community Bus Me-Bus (三沢市コミュニティバス「みーばす」)
    country: JP
    subdivision_code: JP-02
    subdivision_name: Aomori
    static_gtfs_url: https://api.gtfs-data.jp/v2/organizations/misawacity/feeds/misawacity-mebus/files/feed.zip?rid=current
    license_note: >-
      CC BY 4.0; published as GTFS-JP open data by Misawa City through
      the GTFS Data Repository (gtfs-data.jp). Credit Misawa City.
    operating_note: >-
      Misawa City's Me-Bus community network (コミュニティバス「みーばす」); a second
      Aomori feed record distinct from Hachinohe.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://gtfs-data.jp/feed/misawacity.misawacity-mebus
      terms_url: https://creativecommons.org/licenses/by/4.0/
      scope: [gtfs_schedule]
      attribution: >-
        Misawa City. Published as GTFS-JP open data through the GTFS
        Data Repository (gtfs-data.jp), operated by AIGID.
      reviewed_by: ChelseaKR
      reviewed_on: "2026-07-18"
      identity_reviewed: true

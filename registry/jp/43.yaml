    name: Kumamoto City Tram (熊本市電)
    country: JP
    subdivision_code: JP-43
    subdivision_name: Kumamoto
    static_gtfs_url: https://api.gtfs-data.jp/v2/organizations/kumamoto-shiden/feeds/kumamotoshiden/files/feed.zip?rid=current
    license_note: >-
      CC BY 2.1 JP (the Japan jurisdiction port of Creative Commons
      Attribution 2.1); published as GTFS-JP open data by Kumamoto City
      Transportation Bureau through the GTFS Data Repository
      (gtfs-data.jp). Credit Kumamoto City Transportation Bureau.
    operating_note: >-
      The Kumamoto City tram / streetcar network (熊本市電) run by the
      Kumamoto City Transportation Bureau; a first-party operator feed
      counted as one feed record.
    reuse_evidence:
      decision: approved
      source_kind: official_portal
      provider_source_url: https://gtfs-data.jp/feed/kumamoto-shiden.kumamotoshiden
      terms_url: https://creativecommons.org/licenses/by/2.1/jp/
      scope: [gtfs_schedule]
      attribution: >-
        Kumamoto City Transportation Bureau (熊本市交通局). Published as
        GTFS-JP open data (CC BY 2.1 JP) through the GTFS Data
